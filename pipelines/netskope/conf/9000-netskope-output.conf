filter {
  # Do not set data_stream_namespace here; that will be handled in the return pipeline
  mutate {
    add_field => {
      "data_stream_dataset" => "netskope"
    }
    id => "9000-netskope-dataset-finalize"
  }
}

output {
  elasticsearch {
    id => "9000-netskope-output"
    data_stream => true
    data_stream_type => "logs"
    data_stream_namespace => "siem"
    hosts => [ "${ELASTICSEARCH_ES_HOSTS}" ]
    user => "${ELASTICSEARCH_ES_USER}"
    password => "${ELASTICSEARCH_ES_PASSWORD}"
    ssl_enabled => true
    ssl_certificate_authorities => "${ELASTICSEARCH_ES_SSL_CERTIFICATE_AUTHORITY}"
  }
}

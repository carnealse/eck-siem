output {
  if [data_stream][dataset] == "aws.waf" {
    pipeline { send_to => "aws-waf" }
  } else if [data_stream][namespace] == "cat.dev" {
    pipeline { send_to => "cat-dev" }
  } else if [data_stream][dataset] == "clamav" or [data_stream][dataset] == "clamavcustom" {
    pipeline { send_to => "clamav" }
  } else if "ls-esaudit" in [tags] {
    pipeline { send_to => "es-audit-logs" }
  } else if [data_stream][dataset] == "google_workspace" {
    pipeline { send_to => "google-workspace" }
  } else if "ls-http" in [tags] {
    pipeline { send_to => "logstash-https" }
  } else if [data_stream][dataset] == "meraki" {
    pipeline { send_to => "meraki" }
  } else if [data_stream][dataset] == "netskope-v2" {
    pipeline { send_to => "netskope" }
  } else if [data_stream][dataset] == "netskope" {
    pipeline { send_to => "netskope" }
  } else if [data_stream][dataset] == "nexus" {
    pipeline { send_to => "nexus" }
  } else if [data_stream][dataset] == "nexusfw" {
    pipeline { send_to => "nexusfw" }
  } else if [data_stream][dataset] == "sonarqube" {
    pipeline { send_to => "sonarqube" }
  } else if [data_stream][dataset] == "cef.log" {
    pipeline { send_to => "tas-cef" }
  } else if [data_stream][dataset] == "uaa.log" {
    pipeline { send_to => "tas-uaa" }
  } else if [data_stream][dataset] == "trufflehog" {
    pipeline { send_to => "trufflehog" }
  } else if [data_stream][dataset] == "aws.vpcflow" {
    pipeline { send_to => "vpcflow" }
  } else if [data_stream][dataset] == "c2imera" {
    pipeline { send_to => "c2imera" }
  } else {
    pipeline { send_to => "fallback" }
  }
}

filter {
  # Basic Housekeeping #
  fingerprint {
    id => "1000-gitlab-message-fingerprint-01"
    source => "message"
    target => "[@metadata][fingerprint]"
    method => "SHA256"
  }

  mutate {
    id => "1000-gitlab-initialize-ecs-mutate-01"
    add_tag => ["logstash"]
    add_field => {"[ecs][version]" => "8.0.0"}
  }

  if "_mutate_error" in [tags] {

    mutate {
      add_field => {
        "[error][source_plugin_id]" => "1000-gitlab-initialize-ecs-mutate-01"
      }
      add_tag => ["_logstash_attributed_mutate_error"]
      remove_tag => ["_mutate_error"]
    }
  }

  json {
    id => "1000-gitlab-gitlab_json_parse-json-01"
    source => "message"
    target => "gitlab"
    tag_on_failure => ["_jsonparsefailure"]
  }

  if "_jsonparsefailure" in [tags] {
    mutate {
      add_field => {
        "[error][source_plugin_id]" => "1000-gitlab-gitlab_json_parse-json-01"
      }
      add_tag => ["_logstash_attributed_json_parse_failure"]
      remove_tag => ["_jsonparsefailure"]
    }
  }


  # required to check the [error][source_config] array as LS evaluation has limitations with arrays
  ruby {
    id => "1000-gitlab-normalization-source-config-fallback"
    code => '
      plugin_ids = event.get("[error][source_plugin_id]")
      if plugin_ids
        ids_array = plugin_ids.is_a?(Array) ? plugin_ids : [plugin_ids]
        has_match = ids_array.any? { |id| id.to_s.start_with?("1000-gitlab") }
        if has_match
          configs = event.get("[error][source_config]")
          configs_array = configs.nil? ? [] : (configs.is_a?(Array) ? configs : [configs])
          unless configs_array.include?("1000-gitlab-normalization.conf")
            event.set("[_temp][config_boolean]", "true")
          end
        end
      end
    '
  }

  # paired with the ruby above to append the [error][source_config] and not just replace exisiting values
  if [_temp][config_boolean] == "true" {
    mutate {
      add_field => {
        "[error][source_config]" => "1000-gitlab-normalization.conf"
      }
      remove_field => ["[_temp]"]
    }
  }
}

input {
  pipeline {
    address => "c2imera"
    id => "0000-c2imera-input"
  }
}

filter {
  # Detects if the log starts with the CloudWatch/AWS wrapper pattern
  if [message] =~ /^{"messageType":/ {
    # 1. Parse the wrapper into c2imera top field
    json {
      id => "0000-c2imera-cloudwatch-json-parse-json-01"
      source => "message"
      target => "[c2imera]"
      tag_on_failure => ["_jsonparsefailure", "_logstash_failure__0000-c2imera-input__json__0000-c2imera-cloudwatch-json-parse-json-01"]
    }

    if "_logstash_failure__0000-c2imera-input__json__0000-c2imera-cloudwatch-json-parse-json-01" in [tags] {
      if ![error][source_config] {
        mutate {
          add_field => {
            "[error][source_config]" => "0000-c2imera-input.conf"
          }
        }
      }

      mutate {
        add_field => {
          "[error][source_plugin_id]" => "0000-c2imera-cloudwatch-json-parse-json-01"
        }
        remove_tag => ["_logstash_failure__0000-c2imera-input__json__0000-c2imera-cloudwatch-json-parse-json-01"]
      }
    }

    # Record when we received the log before we potentially overwrite @timestamp
    mutate {
      id => "0000-c2imera-copy-timestamp-mutate-01"
      copy => { "@timestamp" => "[event][created]" }
    }

    if "_mutate_error" in [tags] {
      if ![error][source_config] {
        mutate {
          add_field => {
            "[error][source_config]" => "0000-c2imera-input.conf"
          }
        }
      }

      mutate {
        add_field => {
          "[error][source_plugin_id]" => "0000-c2imera-copy-timestamp-mutate-01"
        }
        add_tag => ["_logstash_attributed_mutate_error"]
        remove_tag => ["_mutate_error"]
      }
    }

    # 2. Extract the actual log line
    if [c2imera][message] {
      # Overwrite the main message field with the inner log so
      # the Gatekeeper and Lanes see the raw log text.
      mutate {
        id => "0000-c2imera-extract-inner-message-mutate-02"
        replace => { "message" => "%{[c2imera][message]}" }
      }

      if "_mutate_error" in [tags] {
        if ![error][source_config] {
          mutate {
            add_field => {
              "[error][source_config]" => "0000-c2imera-input.conf"
            }
          }
        }

        mutate {
          add_field => {
            "[error][source_plugin_id]" => "0000-c2imera-extract-inner-message-mutate-02"
          }
          add_tag => ["_logstash_attributed_mutate_error"]
          remove_tag => ["_mutate_error"]
        }
      }
    }
  }
}

input {
  pipeline {
    address => "c2imera"
    id => "0000-c2imera-input"
  }
}

filter {
  # Detects if the log starts with the CloudWatch/AWS wrapper pattern
  if [message] =~ /^{"messageType":/ {
    # 1. Parse the wrapper into c2imera top field
    json {
      id => "0000-c2imera-cloudwatch-json-parse"
      source => "message"
      target => "[c2imera]"
      tag_on_failure => ["_jsonparsefailure", "_logstash_failure__0000-c2imera-input__json__0000-c2imera-cloudwatch-json-parse"]
    }

    if "_logstash_failure__0000-c2imera-input__json__0000-c2imera-cloudwatch-json-parse" in [tags] {
      mutate {
        add_field => {
          "[error][source_config]"    => "0000-c2imera-input.conf"
          "[error][source_plugin_id]" => "0000-c2imera-cloudwatch-json-parse"
        }
      }
    }

    # Record when we received the log before we potentially overwrite @timestamp
    mutate {
      id => "0000-c2imera-copy-timestamp"
      copy => { "@timestamp" => "[event][created]" }
    }

    if "_mutate_error" in [tags] {
      mutate {
        add_field => {
          "[error][source_config]"    => "0000-c2imera-input.conf"
          "[error][source_plugin_id]" => "0000-c2imera-copy-timestamp"
        }
        add_tag => ["_logstash_failure__0000-c2imera-input__mutate__0000-c2imera-copy-timestamp", "_logstash_attributed_mutate_error"]
        remove_tag => ["_mutate_error"]
      }
    }

    # 2. Extract the actual log line
    if [c2imera][message] {
      # Overwrite the main message field with the inner log so
      # the Gatekeeper and Lanes see the raw log text.
      mutate {
        id => "0000-c2imera-extract-inner-message"
        replace => { "message" => "%{[c2imera][message]}" }
      }

      if "_mutate_error" in [tags] {
        mutate {
          add_field => {
            "[error][source_config]"    => "0000-c2imera-input.conf"
            "[error][source_plugin_id]" => "0000-c2imera-extract-inner-message"
          }
          add_tag => ["_logstash_failure__0000-c2imera-input__mutate__0000-c2imera-extract-inner-message", "_logstash_attributed_mutate_error"]
          remove_tag => ["_mutate_error"]
        }
      }
    }
  }
}

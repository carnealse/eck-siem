filter {
  if [@metadata][log_lane] in ["java_lane", "legacy_lane"] {
    mutate {
      id => "3000-c2imera-ecs-mapping-mutate-01"
      add_field => {
        "[event][kind]"    => "event"
        "[event][dataset]" => "c2imera"
      }
    }

    if "_mutate_error" in [tags] {

      mutate {
        add_field => {
          "[error][source_plugin_id]" => "3000-c2imera-ecs-mapping-mutate-01"
        }
        add_tag => ["_logstash_attributed_mutate_error"]
        remove_tag => ["_mutate_error"]
      }
    }
  }


  # required to check the [error][source_config] array as LS evaluation has limitations with arrays
  ruby {
    id => "3000-c2imera-ecs-mapping-source-config-fallback"
    code => '
      plugin_ids = event.get("[error][source_plugin_id]")
      if plugin_ids
        ids_array = plugin_ids.is_a?(Array) ? plugin_ids : [plugin_ids]
        has_match = ids_array.any? { |id| id.to_s.start_with?("3000-c2imera") }
        if has_match
          configs = event.get("[error][source_config]")
          configs_array = configs.nil? ? [] : (configs.is_a?(Array) ? configs : [configs])
          unless configs_array.include?("3000-c2imera-ecs-mapping.conf")
            event.set("[_temp][config_boolean]", "true")
          end
        end
      end
    '
  }

  # paired with the ruby above to append the [error][source_config] and not just replace exisiting values
  if [_temp][config_boolean] == "true" {
    mutate {
      add_field => {
        "[error][source_config]" => "3000-c2imera-ecs-mapping.conf"
      }
      remove_field => ["[_temp]"]
    }
  }

  if [c2imera][sync][payload] {
    mutate {
      id => "3000-c2imera-ecs-mapping-payload-mutate-03"
      rename => {
        "[c2imera][sync][payload][baseStatusChangeIds]"                 => "[c2imera][sync][payload][base_status_change_ids]"
        "[c2imera][sync][payload][lastSyncTimeThreshold]"               => "[c2imera][sync][payload][last_sync_time_threshold]"
        "[c2imera][sync][payload][parentObjects]"                       => "[c2imera][sync][payload][parent_objects]"
        "[c2imera][sync][payload][objects][0][Base]"                    => "[c2imera][sync][payload][objects][base]"
        "[c2imera][sync][payload][objects][0][ACFT]"                    => "[c2imera][sync][payload][objects][acft]"
        "[c2imera][sync][payload][objects][0][linkedToDataObjectId]"    => "[c2imera][sync][payload][objects][linked_to_data_object_id]"
        "[c2imera][sync][payload][objects][0][Custom Page]"             => "[c2imera][sync][payload][objects][custom_page]"
        "[c2imera][sync][payload][objects][0][Custom Page01]"           => "[c2imera][sync][payload][objects][custom_page][01]"
        "[c2imera][sync][payload][objects][0][Custom Page02]"           => "[c2imera][sync][payload][objects][custom_page][02]"
        "[c2imera][sync][payload][objects][0][Custom Page03]"           => "[c2imera][sync][payload][objects][custom_page][03]"
        "[c2imera][sync][payload][objects][0][DATE]"                    => "[c2imera][sync][payload][objects][date]"
        "[c2imera][sync][payload][objects][0][DEST ICAO]"               => "[c2imera][sync][payload][objects][dest_icao]"
        "[c2imera][sync][payload][objects][0][IFR/VFR]"                 => "[c2imera][sync][payload][objects][ifr_vfr]"
        "[c2imera][sync][payload][objects][0][Geometry]"                => "[c2imera][sync][payload][objects][geometry]"
        "[c2imera][sync][payload][objects][0][Properties]"              => "[c2imera][sync][payload][objects][properties]"
        "[c2imera][sync][payload][objects][0][ETE]"                     => "[c2imera][sync][payload][objects][ete]"
        "[c2imera][sync][payload][objects][0][COP Pin]"                 => "[c2imera][sync][payload][objects][cop_pin]"
        "[c2imera][sync][payload][objects][0][ETA]"                     => "[c2imera][sync][payload][objects][eta]"
        "[c2imera][sync][payload][objects][0][Files]"                   => "[c2imera][sync][payload][objects][files]"
        "[c2imera][sync][payload][objects][0][tags]"                    => "[c2imera][sync][payload][objects][tags]"
        "[c2imera][sync][payload][objects][0][ETD]"                     => "[c2imera][sync][payload][objects][etd]"
        "[c2imera][sync][payload][objects][0][Last Updated Date/Time]"  => "[c2imera][sync][payload][objects][last][updated][date_time]"
        "[c2imera][sync][payload][objects][0][Last Updated Unit]"       => "[c2imera][sync][payload][objects][last][updated][unit]"
        "[c2imera][sync][payload][objects][0][parentId]"                => "[c2imera][sync][payload][objects][parent_id]"
        "[c2imera][sync][payload][objects][0][CALLSIGN]"                => "[c2imera][sync][payload][objects][callsign]"
        "[c2imera][sync][payload][objects][0][lastModified]"            => "[c2imera][sync][payload][objects][last][modified]"
        "[c2imera][sync][payload][objects][0][RECD OPS]"                => "[c2imera][sync][payload][objects][recd_ops]"
        "[c2imera][sync][payload][objects][0][DEP ICAO]"                => "[c2imera][sync][payload][objects][dep_icao]"
        "[c2imera][sync][payload][objects][0][UseUnitOwnable]"          => "[c2imera][sync][payload][objects][use_unit_ownable]"
        "[c2imera][sync][payload][objects][0][version]"                 => "[c2imera][sync][payload][objects][version]"
        "[c2imera][sync][payload][objects][0][ATA]"                     => "[c2imera][sync][payload][objects][ata]"
        "[c2imera][sync][payload][objects][0][STATUS]"                  => "[c2imera][sync][payload][objects][status]"
        "[c2imera][sync][payload][objects][0][Unit]"                    => "[c2imera][sync][payload][objects][unit]"
        "[c2imera][sync][payload][objects][0][Last Updated User]"       => "[c2imera][sync][payload][objects][last][updated][user]"
        "[c2imera][sync][payload][objects][0][id]"                      => "[c2imera][sync][payload][objects][id]"
        "[c2imera][sync][payload][objects][0][type]"                    => "[c2imera][sync][payload][objects][type]"
        "[c2imera][sync][payload][objects][0][ATD]"                     => "[c2imera][sync][payload][objects][atd]"
        "[c2imera][sync][payload][objects][0][Permissions Flag]"        => "[c2imera][sync][payload][objects][permissions_flag]"
        "[c2imera][sync][payload][proposedLastTimeThreshold]"           => "[c2imera][sync][payload][proposed_last_time_threshold]"
        "[c2imera][sync][payload][customPageNames][CustomPage01]"       => "[c2imera][sync][payload][custom_page_names][custom_page][01]"
        "[c2imera][sync][payload][customPageNames][CustomPage02]"       => "[c2imera][sync][payload][custom_page_names][custom_page][02]"
        "[c2imera][sync][payload][customPageNames][CustomPage03]"       => "[c2imera][sync][payload][custom_page_names][custom_page][03]"
        "[c2imera][sync][payload][howManyByType][CustomPage01]"         => "[c2imera][sync][payload][how_many_by_type][custom_page][01]"
        "[c2imera][sync][payload][howManyByType][CustomPage02]"         => "[c2imera][sync][payload][how_many_by_type][custom_page][02]"
        "[c2imera][sync][payload][howManyByType][CustomPage03]"         => "[c2imera][sync][payload][how_many_by_type][custom_page][03]"
        "[c2imera][sync][payload][payloadId]"                           => "[c2imera][sync][payload][payload_id]"
        "[c2imera][sync][payload][deletedIds]"                          => "[c2imera][sync][payload][deleted][ids]"
        "[c2imera][sync][payload][activeBaseName]"                      => "[c2imera][sync][payload][active_base_name]"
        "[c2imera][sync][payload][howManyParentsByType]"                => "[c2imera][sync][payload][how_many_parents_by_type]"
        "[c2imera][sync][payload][pushTime]"                            => "[c2imera][sync][payload][push_time]"
      }
    }

    if "_mutate_error" in [tags] {
      mutate {
        add_field => {
          "[error][source_plugin_id]" => "3000-c2imera-ecs-mapping-payload-mutate-03"
        }
        add_tag => ["_logstash_attributed_mutate_error"]
        remove_tag => ["_mutate_error"]
      }
    }
  }
}

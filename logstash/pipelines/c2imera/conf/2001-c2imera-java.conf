​filter {
  if [@metadata][log_lane] == "java_lane" {
    # 1. Generic Java Header (Priority List)
    grok {
      id => "2001-c2imera-java-header-grok-01"
      match => {
        "message" => [
          # Pattern 1: Message + OID (Priority)
          "^%{DATA:raw_ts}\s+%{JAVACLASS:[log][logger]}\s+(?:%{LOGLEVEL:[log][level]}|FINE|FINER|FINEST)\s+\[%{DATA:[process][thread][name]}\]\s+-\s+%{GREEDYDATA:app_message} \(OID:%{DATA:[trace][id]}\)\s*$",
          # Pattern 2: Message Only (Fallback)
          "^%{DATA:raw_ts}\s+%{JAVACLASS:[log][logger]}\s+(?:%{LOGLEVEL:[log][level]}|FINE|FINER|FINEST)\s+\[%{DATA:[process][thread][name]}\]\s+-\s+%{GREEDYDATA:app_message}\s*$"
        ]
      }
      tag_on_failure => ["_grokparsefailure"]
    }

    if "_grokparsefailure" in [tags] {
      mutate {
        add_field => {
          "[error][source_plugin_id]" => "2001-c2imera-java-header-grok-01"
        }
        add_tag => ["_logstash_attributed_grok_parse_failure"]
        remove_tag => ["_grokparsefailure"]
      }
    }

    date {
      id => "2001-c2imera-java-date-01"
      match => [ "raw_ts", "yyyyMMddHHmmssSSS" ]
      target => "@timestamp"
      tag_on_failure => ["_dateparsefailure"]
    }

    if "_dateparsefailure" in [tags] {
      mutate {
        add_field => {
          "[error][source_plugin_id]" => "2001-c2imera-java-date-01"
        }
        add_tag => ["_logstash_attributed_date_parse_failure"]
        remove_tag => ["_dateparsefailure"]
      }
    }

    # Topic 1: aws.SsmConfiguration
    if [log][logger] == "aws.SsmConfiguration" {
      grok {
        id => "2001-c2imera-java-ssm-grok-02"
        match => { "app_message" => "%{DATA:ssm_action}: \[%{DATA:ssm_content}\]" }
        tag_on_failure => ["_grokparsefailure"]
      }

      if "_grokparsefailure" in [tags] {
        mutate {
          add_field => {
            "[error][source_plugin_id]" => "2001-c2imera-java-ssm-grok-02"
          }
          add_tag => ["_logstash_attributed_grok_parse_failure"]
          remove_tag => ["_grokparsefailure"]
        }
      }

      if [ssm_action] == "Finished reload" {
        kv {
          id => "2001-c2imera-java-ssm-kv-01"
          source => "ssm_content"
          target => "[temp_ssm]"
          field_split => ", "
          value_split => " = "
          remove_char_key => "\""
          remove_char_value => "\""
          tag_on_failure => ["_grok_kv_parse_failure"]
        }

        if "_grok_kv_parse_failure" in [tags] {
          mutate {
            add_field => {
              "[error][source_plugin_id]" => "2001-c2imera-java-ssm-kv-01"
            }
            add_tag => ["_logstash_attributed_kv_parse_failure"]
            remove_tag => ["_grok_kv_parse_failure"]
          }
        }

        mutate {
          id => "2001-c2imera-java-ssm-renames-mutate-01"
          rename => {
            "[temp_ssm][EMAIL_FROM]"                => "[email][from][address]"
            "[temp_ssm][PLATFORM]"                  => "[service][environment]"
            "[temp_ssm][FILE_UPLOAD_DIRECTORY]"     => "[file][directory]"
            "[temp_ssm][FILE_UPLOAD_SIZE_LIMIT]"    => "[file][size]"
            "[temp_ssm][DB_DIALECT]"                => "[c2imera][ssm][db][dialect]"
            "[temp_ssm][DB_DRIVER]"                 => "[c2imera][ssm][db][driver]"
            "[temp_ssm][DB_PASSWORD]"               => "[c2imera][ssm][db][password]"
            "[temp_ssm][DB_FILEPASSWORD]"           => "[c2imera][ssm][db][file_password]"
            "[temp_ssm][DB_BACKUP_DELAY_MINUTES]"   => "[c2imera][ssm][db][backup][delay_minutes]"
            "[temp_ssm][DB_BACKUP_START_TIME_MINUTE]" => "[c2imera][ssm][db][backup][start_minute]"
            "[temp_ssm][DB_BACKUP_START_TIME_HOUR]" => "[c2imera][ssm][db][backup][start_hour]"
            "[temp_ssm][DB_BACKUP_ENABLE]"          => "[c2imera][ssm][db][backup][enable]"
            "[temp_ssm][SYNC_ROLE]"                 => "[c2imera][ssm][sync][role]"
            "[temp_ssm][SYNC_ADDRESS]"              => "[c2imera][ssm][sync][address]"
            "[temp_ssm][SYNC_USERNAME]"             => "[c2imera][ssm][sync][username]"
            "[temp_ssm][SYNC_PASSWORD]"             => "[c2imera][ssm][sync][password]"
            "[temp_ssm][SYNC_ID_PREFIX]"            => "[c2imera][ssm][sync][id_prefix]"
            "[temp_ssm][KmeKA_BOOTSTRAP_SERVERS]"   => "[c2imera][ssm][kmeka][bootstrap_servers]"
            "[temp_ssm][KmeKA_USERNAME]"            => "[c2imera][ssm][kmeka][username]"
            "[temp_ssm][KmeKA_PASSWORD]"            => "[c2imera][ssm][kmeka][password]"
            "[temp_ssm][KmeKA_CACHE_DB_PASSWORD]"   => "[c2imera][ssm][kmeka][cache_db_password]"
            "[temp_ssm][EMAIL_SMS]"                 => "[c2imera][ssm][email][sms]"
            "[temp_ssm][CRITICAL_CONTACT]"          => "[c2imera][ssm][contact][critical]"
            "[temp_ssm][NORMAL_CONTACT]"            => "[c2imera][ssm][contact][normal]"
            "[temp_ssm][IMPROVEMENTS_CONTACT]"      => "[c2imera][ssm][contact][improvements]"
            "[temp_ssm][DEFAULT_ADMIN_USERNAME]"    => "[c2imera][ssm][admin][default_username]"
            "[temp_ssm][DEFAULT_ADMIN_EDIPI]"       => "[c2imera][ssm][admin][default_edipi]"
            "[temp_ssm][CROSS_DOMAIN_USERNAME]"     => "[c2imera][ssm][cross_domain][username]"
            "[temp_ssm][CROSS_DOMAIN_PASSWORD]"     => "[c2imera][ssm][cross_domain][password]"
            "[temp_ssm][REACT_BETA]"                => "[c2imera][ssm][react][beta]"
            "[temp_ssm][REACT_BETA_CANDIDATES]"     => "[c2imera][ssm][react][beta_candidates]"
            "[temp_ssm][CLASSIFICATION_LEVEL]"      => "[c2imera][ssm][classification_level]"
            "[temp_ssm][DATA_DIRECTORY]"            => "[c2imera][ssm][data_directory]"
            "[temp_ssm][COMMUNICATION_BANNER]"      => "[c2imera][ssm][communication_banner]"
            "[temp_ssm][OPENAPI_THROTTLE_comLIS]"   => "[c2imera][ssm][openapi][throttle_comlis]"
            "[temp_ssm][MONOLITH_LOGIN_RATE_LIMIT]" => "[c2imera][ssm][monolith][login_rate_limit]"
          }
        }

        if "_mutate_error" in [tags] {

          mutate {
            add_field => {
              "[error][source_plugin_id]" => "2001-c2imera-java-ssm-renames-mutate-01"
            }
            add_tag => ["_logstash_attributed_mutate_error"]
            remove_tag => ["_mutate_error"]
          }
        }
      }
      else if [ssm_action] == "Reload starting" {
        mutate {
          id => "2001-c2imera-java-ssm-reload-split-mutate-02"
          split => { "ssm_content" => ", " }
        }

        if "_mutate_error" in [tags] {

          mutate {
            add_field => {
              "[error][source_plugin_id]" => "2001-c2imera-java-ssm-reload-split-mutate-02"
            }
            add_tag => ["_logstash_attributed_mutate_error"]
            remove_tag => ["_mutate_error"]
          }
        }
        mutate {
          id => "2001-c2imera-java-ssm-reload-rename-mutate-03"
          rename => { "ssm_content" => "[c2imera][ssm][reloaded_parameters]" }
        }

        if "_mutate_error" in [tags] {

          mutate {
            add_field => {
              "[error][source_plugin_id]" => "2001-c2imera-java-ssm-reload-rename-mutate-03"
            }
            add_tag => ["_logstash_attributed_mutate_error"]
            remove_tag => ["_mutate_error"]
          }
        }
      }
    }

    # Topic 2: util.Auditor
    else if [log][logger] == "util.Auditor" {
      if [app_message] =~ /^AUDIT: HEADER =/ {
        grok {
          id => "2001-c2imera-java-auditor-header-grok-03"
          match => { "app_message" => "AUDIT: HEADER = %{DATA:header_key}: %{GREEDYDATA:header_value}" }
          tag_on_failure => ["_grokparsefailure"]
        }

        if "_grokparsefailure" in [tags] {
          mutate {
            add_field => {
              "[error][source_plugin_id]" => "2001-c2imera-java-auditor-header-grok-03"
            }
            add_tag => ["_logstash_attributed_grok_parse_failure"]
            remove_tag => ["_grokparsefailure"]
          }
        }

        if [header_key] == "User-Agent" {
          mutate {
            id => "2001-c2imera-java-auditor-useragent-rename-mutate-04"
            rename => { "header_value" => "[user_agent][original]" }
          }

          if "_mutate_error" in [tags] {

            mutate {
              add_field => {
                "[error][source_plugin_id]" => "2001-c2imera-java-auditor-useragent-rename-mutate-04"
              }
              add_tag => ["_logstash_attributed_mutate_error"]
              remove_tag => ["_mutate_error"]
            }
          }
          useragent {
            id => "2001-c2imera-java-auditor-useragent-parse"
            source => "[user_agent][original]"
            target => "user_agent"
            ecs_compatibility => "v8"
          }
        }
        else if [header_key] == "Referer" {
          mutate {
            id => "2001-c2imera-java-auditor-referer-rename-mutate-05"
            rename => { "header_value" => "[http][request][referrer]" }
          }

          if "_mutate_error" in [tags] {

            mutate {
              add_field => {
                "[error][source_plugin_id]" => "2001-c2imera-java-auditor-referer-rename-mutate-05"
              }
              add_tag => ["_logstash_attributed_mutate_error"]
              remove_tag => ["_mutate_error"]
            }
          }
        }
        else {
          mutate {
            id => "2001-c2imera-java-auditor-header-add-mutate-06"
            add_field => { "[http][request][headers][%{header_key}]" => "%{header_value}" }
          }

          if "_mutate_error" in [tags] {

            mutate {
              add_field => {
                "[error][source_plugin_id]" => "2001-c2imera-java-auditor-header-add-mutate-06"
              }
              add_tag => ["_logstash_attributed_mutate_error"]
              remove_tag => ["_mutate_error"]
            }
          }
        }

        mutate {
          id => "2001-c2imera-java-auditor-header-cleanup-mutate-07"
          remove_field => ["header_key", "header_value"]
        }

        if "_mutate_error" in [tags] {

          mutate {
            add_field => {
              "[error][source_plugin_id]" => "2001-c2imera-java-auditor-header-cleanup-mutate-07"
            }
            add_tag => ["_logstash_attributed_mutate_error"]
            remove_tag => ["_mutate_error"]
          }
        }
      }
      else if [app_message] =~ /^AUDIT: username =/ {
        grok {
          id => "2001-c2imera-java-auditor-username-grok-04"
          match => { "app_message" => "AUDIT: username = %{DATA:[user][name]}\.\s+%{GREEDYDATA:[event][action]}" }
          tag_on_failure => ["_grokparsefailure"]
        }

        if "_grokparsefailure" in [tags] {
          mutate {
            add_field => {
              "[error][source_plugin_id]" => "2001-c2imera-java-auditor-username-grok-04"
            }
            add_tag => ["_logstash_attributed_grok_parse_failure"]
            remove_tag => ["_grokparsefailure"]
          }
        }

        if [event][action] =~ /^(SUCCESS|FAILURE),/ {
          grok {
            id => "2001-c2imera-java-auditor-outcome-grok-05"
            match => { "[event][action]" => "%{WORD:[event][outcome]},\s+%{GREEDYDATA:[event][reason]}" }
            tag_on_failure => ["_grokparsefailure"]
          }

          if "_grokparsefailure" in [tags] {
            mutate {
              add_field => {
                "[error][source_plugin_id]" => "2001-c2imera-java-auditor-outcome-grok-05"
              }
              add_tag => ["_logstash_attributed_grok_parse_failure"]
              remove_tag => ["_grokparsefailure"]
            }
          }
          mutate {
            id => "2001-c2imera-java-auditor-outcome-mutate-08"
            lowercase => [ "[event][outcome]" ]
            replace => { "[event][action]" => "audit-check" }
          }

          if "_mutate_error" in [tags] {

            mutate {
              add_field => {
                "[error][source_plugin_id]" => "2001-c2imera-java-auditor-outcome-mutate-08"
              }
              add_tag => ["_logstash_attributed_mutate_error"]
              remove_tag => ["_mutate_error"]
            }
          }
        }
        else if [event][action] =~ /^PII:/ {
          grok {
            id => "2001-c2imera-java-auditor-pii-grok-06"
            match => { "[event][action]" => "PII:\s+%{GREEDYDATA:[event][reason]}" }
            tag_on_failure => ["_grokparsefailure"]
          }

          if "_grokparsefailure" in [tags] {
            mutate {
              add_field => {
                "[error][source_plugin_id]" => "2001-c2imera-java-auditor-pii-grok-06"
              }
              add_tag => ["_logstash_attributed_grok_parse_failure"]
              remove_tag => ["_grokparsefailure"]
            }
          }
          mutate {
            id => "2001-c2imera-java-auditor-pii-mutate-09"
            replace => { "[event][action]" => "pii-access" }
          }

          if "_mutate_error" in [tags] {

            mutate {
              add_field => {
                "[error][source_plugin_id]" => "2001-c2imera-java-auditor-pii-mutate-09"
              }
              add_tag => ["_logstash_attributed_mutate_error"]
              remove_tag => ["_mutate_error"]
            }
          }
        }
      }
    }

    # Topic 3: restauth.CertStoreJwsFunction
    else if [log][logger] == "restauth.CertStoreJwsFunction" {
      if [app_message] =~ /^Using trusted user:RestUser/ {
        grok {
          id => "2001-c2imera-java-certstorejws-grok-07"
          match => { "app_message" => "Using trusted user:RestUser%{DATA:user_info} roles:" }
          tag_on_failure => ["_grokparsefailure"]
        }

        if "_grokparsefailure" in [tags] {
          mutate {
            add_field => {
              "[error][source_plugin_id]" => "2001-c2imera-java-certstorejws-grok-07"
            }
            add_tag => ["_logstash_attributed_grok_parse_failure"]
            remove_tag => ["_grokparsefailure"]
          }
        }
      }
    }

    # Topic 4: rest.OperationIdFilter
    else if [log][logger] == "rest.OperationIdFilter" {
      if [app_message] =~ /^Request path/ {
        mutate {
          id => "2001-c2imera-java-opfilter-copy-mutate-10"
          copy => { "[app_message]" => "[event][reason]" }
        }

        if "_mutate_error" in [tags] {

          mutate {
            add_field => {
              "[error][source_plugin_id]" => "2001-c2imera-java-opfilter-copy-mutate-10"
            }
            add_tag => ["_logstash_attributed_mutate_error"]
            remove_tag => ["_mutate_error"]
          }
        }
        grok {
          id => "2001-c2imera-java-opfilter-grok-08"
          match => { "app_message" => "Request path \"%{DATA:[url][path]}\" did not provide %{DATA:[c2imera][op_filter][missing_header]} header value" }
          tag_on_failure => ["_grokparsefailure"]
        }

        if "_grokparsefailure" in [tags] {
          mutate {
            add_field => {
              "[error][source_plugin_id]" => "2001-c2imera-java-opfilter-grok-08"
            }
            add_tag => ["_logstash_attributed_grok_parse_failure"]
            remove_tag => ["_grokparsefailure"]
          }
        }
      }
    }

    # Topic 5: servlets.ServerClientSyncServlet
    else if [log][logger] == "servlets.ServerClientSyncServlet" {
      if [app_message] =~ /Ping received/ {
        grok {
          id => "2001-c2imera-java-sync-ping-grok-09"
          match => { "app_message" => "Ping received %{DATA:ping_json} code: %{INT:[c2imera][sync][response_code]}" }
          tag_on_failure => ["_grokparsefailure"]
        }

        if "_grokparsefailure" in [tags] {
          mutate {
            add_field => {
              "[error][source_plugin_id]" => "2001-c2imera-java-sync-ping-grok-09"
            }
            add_tag => ["_logstash_attributed_grok_parse_failure"]
            remove_tag => ["_grokparsefailure"]
          }
        }

        if [ping_json] {
          ruby {
            id => "2001-c2imera-java-sync-ping-ruby-01"
            code => 'val = event.get("[ping_json]"); if val then event.set("[ping_json]", val.downcase) end'
            tag_on_exception => "_rubyexception"
          }

          if "_rubyexception" in [tags] or "ruby_exception" in [tags] {
            mutate {
              add_field => {
                "[error][source_plugin_id]" => "2001-c2imera-java-sync-ping-ruby-01"
              }
              add_tag => ["_logstash_attributed_ruby_exception"]
              remove_tag => ["ruby_exception", "_rubyexception"]
            }
          }
        }

        json {
          id => "2001-c2imera-java-sync-ping-json-01"
          source => "ping_json"
          target => "[c2imera][sync][ping_data]"
          tag_on_failure => ["_jsonparsefailure"]
        }

        if "_jsonparsefailure" in [tags] {
          mutate {
            add_field => {
              "[error][source_plugin_id]" => "2001-c2imera-java-sync-ping-json-01"
            }
            add_tag => ["_logstash_attributed_json_parse_failure"]
            remove_tag => ["_jsonparsefailure"]
          }
        }

        mutate {
          id => "2001-c2imera-java-sync-ping-cleanup-mutate-11"
          remove_field => ["ping_json"]
        }

        if "_mutate_error" in [tags] {

          mutate {
            add_field => {
              "[error][source_plugin_id]" => "2001-c2imera-java-sync-ping-cleanup-mutate-11"
            }
            add_tag => ["_logstash_attributed_mutate_error"]
            remove_tag => ["_mutate_error"]
          }
        }
      }
      else {
        grok {
          id => "2001-c2imera-java-sync-grok-10"
          match => {
            "app_message" => [
              "^Activating sync for type: %{GREEDYDATA:[c2imera][sync][type]}(\s+)?$",
              "^DELETED FROM HHQ: %{DATA:[c2imera][sync][deleted_from_hqq]}(\s+)?$",
              "^Deactivating sync for type: %{GREEDYDATA:[c2imera][sync][type]}(\s+)?$",
              "^SYNC_PING_RATE: %{INT:[c2imera][sync][ping_rate]}(\s+)?$",
              "^SYNC_BATCH_SIZE: %{INT:[c2imera][sync][batch_size]}(\s+)?$",
              "^SYNC_PREFIX: %{DATA:[c2imera][sync][prefix]}(\s+)?$",
              "^SYNC_USERNAME: %{DATA:[c2imera][sync][username]}(\s+)?$",
              "^SYNC_ADDRESS: %{DATA:[c2imera][sync][address]}(\s+)?$",
              "^SYNC_ROLE: %{DATA:[c2imera][sync][role]}(\s+)?$",
              "^PING CONNECTION STATUS: %{DATA:[c2imera][sync][ping_connection_status]}(\s+)?$",
              "^REPORTER: %{GREEDYDATA:[c2imera][sync][reporter]}$",
              "^Sync url: %{DATA:[c2imera][sync][url]}(\s+)?$",
              "^isSyncTurnedOnFor: %{GREEDYDATA:[event][reason]}(\s+)?$",
              "^SYNC_HEARTBEAT: %{GREEDYDATA:[c2imera][sync][heartbeat_message]}(\s+)?$",
              "^UPDATED BEAN:Id:(\s+)?%{DATA:[c2imera][sync][updated_bean][id]}, Type:(\s+)?%{DATA:[c2imera][sync][updated_bean][type]}, Last Updated Date: %{DATA:[c2imera][sync][updated_bean][last_updated]}(\s+)?Coordinated Universal Time(\s+)?$",
              "^PAYLOAD: %{GREEDYDATA:[_temp_payload]}"
            ]
          }
          tag_on_failure => ["_grokparsefailure"]
        }

        if "_grokparsefailure" in [tags] {
          mutate {
            add_field => {
              "[error][source_plugin_id]" => "2001-c2imera-java-sync-grok-10"
            }
            add_tag => ["_logstash_attributed_grok_parse_failure"]
            remove_tag => ["_grokparsefailure"]
          }
        }

        if [_temp_payload] {
          json {
            id => "2001-c2imera-java-payload-json-02"
            source => "[_temp_payload]"
            target => "[c2imera][sync][payload]"
            tag_on_failure => ["_jsonparsefailure"]
          }

          if "_jsonparsefailure" in [tags] {
            mutate {
              add_field => {
                "[error][source_plugin_id]" => "2001-c2imera-java-payload-json-02"
              }
            add_tag => ["_logstash_attributed_json_parse_failure"]
            remove_tag => ["_jsonparsefailure"]
            }
          }

          ruby {
            id => "2001-c2imera-java-sync-payload-ruby-02"
            code => '
              objs = event.get("[c2imera][sync][payload][objects]")
              if objs.is_a?(Array)
                hash = {}
                objs.each_with_index do |obj, i|
                  hash[i.to_s] = obj
                end
                event.set("[c2imera][sync][payload][objects]", hash)
              end
            '
          }

          if "_rubyexception" in [tags] or "ruby_exception" in [tags] {
            mutate {
              add_field => {
                "[error][source_plugin_id]" => "2001-c2imera-java-sync-payload-ruby-02"
              }
              add_tag => ["_logstash_attributed_ruby_exception"]
              remove_tag => ["ruby_exception", "_rubyexception"]
            }
          }
        }

        if [c2imera][sync][updated_bean][last_updated] {
          ruby {
            id => "2001-c2imera-java-sync-updatedbean-ruby-03"
            code => '
              oldtime = event.get("[c2imera][sync][updated_bean][last_updated]")
              if oldtime
                noampm = Time.strptime(oldtime.strip, "%I:%M:%S %p").strftime("%H:%M:%S")
                event.set("[c2imera][sync][updated_bean][last_updated]", noampm)
              end
            '
            tag_on_exception => "_rubyexception"
          }

          if "_rubyexception" in [tags] or "ruby_exception" in [tags] {
            mutate {
              add_field => {
                "[error][source_plugin_id]" => "2001-c2imera-java-sync-updatedbean-ruby-03"
              }
              add_tag => ["_logstash_attributed_ruby_exception"]
              remove_tag => ["ruby_exception", "_rubyexception"]
            }
          }
        }

        if [c2imera][sync][reporter] {
          mutate {
            id => "2001-c2imera-java-sync-type-reporter-mutate-12"
            strip => ["[c2imera][sync][reporter]"]
          }
        }

        if [c2imera][sync][type] {
          mutate {
            id => "2001-c2imera-java-sync-type-strip-mutate-13"
            strip => ["[c2imera][sync][type]"]
          }

          if "_mutate_error" in [tags] {

            mutate {
              add_field => {
                "[error][source_plugin_id]" => "2001-c2imera-java-sync-type-strip-mutate-13"
              }
              add_tag => ["_logstash_attributed_mutate_error"]
              remove_tag => ["_mutate_error"]
            }
          }
        }

        if [app_message] =~ /^Activating/ {
          mutate {
            id => "2001-c2imera-java-sync-activating-mutate-14"
            add_field => { "[event][action]" => "sync-activated" }
          }

          if "_mutate_error" in [tags] {

            mutate {
              add_field => {
                "[error][source_plugin_id]" => "2001-c2imera-java-sync-activating-mutate-14"
              }
              add_tag => ["_logstash_attributed_mutate_error"]
              remove_tag => ["_mutate_error"]
            }
          }
        }
        else if [app_message] =~ /^Deactivating/ {
          mutate {
            id => "2001-c2imera-java-sync-deactivating-mutate-15"
            add_field => { "[event][action]" => "sync-deactivated" }
          }

          if "_mutate_error" in [tags] {

            mutate {
              add_field => {
                "[error][source_plugin_id]" => "2001-c2imera-java-sync-deactivating-mutate-15"
              }
              add_tag => ["_logstash_attributed_mutate_error"]
              remove_tag => ["_mutate_error"]
            }
          }
        }
      }
    }

    # Topic 6: sync.LastSyncTimeTool
    else if [log][logger] == "sync.LastSyncTimeTool" {
      if [app_message] =~ /^Loading last sync time/ {
        grok {
          id => "2001-c2imera-java-lastsync-grok-11"
          match => { "app_message" => "^Loading last sync time for type: %{DATA:[c2imera][sync][type]}(\s+)?$" }
          tag_on_failure => ["_grokparsefailure"]
        }

        if "_grokparsefailure" in [tags] {
          mutate {
            add_field => {
              "[error][source_plugin_id]" => "2001-c2imera-java-lastsync-grok-11"
            }
            add_tag => ["_logstash_attributed_grok_parse_failure"]
            remove_tag => ["_grokparsefailure"]
          }
        }
        mutate {
          id => "2001-c2imera-java-lastsync-mutate-16"
          add_field => { "[event][action]" => "loading-last-sync-time" }
        }

        if "_mutate_error" in [tags] {

          mutate {

              "[error][source_plugin_id]" => "2001-c2imera-java-syncdeterminator-grok-15"
            }
            add_tag => ["_logstash_attributed_grok_parse_failure"]
            remove_tag => ["_grokparsefailure"]
          }
        }
      }
      mutate {
        id => "2001-c2imera-java-syncdeterminator-strip-mutate-22"
        strip => ["[c2imera][sync_determinator]"]
      }

      if "_mutate_error" in [tags] {

        mutate {
          add_field => {
            "[error][source_plugin_id]" => "2001-c2imera-java-syncdeterminator-strip-mutate-22"
          }
          add_tag => ["_logstash_attributed_mutate_error"]
          remove_tag => ["_mutate_error"]
        }
      }
    }

    # Topic 11: internal.UserServiceInternal
    else if [log][logger] == "internal.UserServiceInternal" {
      if [app_message] =~ /^Adding user:/ {
        grok {
          id => "2001-c2imera-java-userservice-grok-16"
          match => { "app_message" => "Adding user: <%{DATA:[user][name]}>" }
          tag_on_failure => ["_grokparsefailure"]

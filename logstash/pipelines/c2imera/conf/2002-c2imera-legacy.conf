filter {
  if [@metadata][log_lane] == "legacy_lane" {
    # 1. Generic Legacy Header
    grok {
      id => "2002-c2imera-legacy-header-grok-01"
      match => {
        "message" => [
          "^%{DATA:raw_ts}\s+%{LOGLEVEL:[log][level]}:\s+%{DATA:app_message} \(OID:%{DATA:[trace][id]}\)\s*\(TID:%{DATA:[process][thread][id]}\)\s*\[%{GREEDYDATA:legacy_class_info}\]$",
          "^%{DATA:raw_ts}\s+%{LOGLEVEL:[log][level]}:\s+%{DATA:app_message} \(OID:%{DATA:[trace][id]}\)\s*\[%{GREEDYDATA:legacy_class_info}\]$",
          "^%{DATA:raw_ts}\s+%{LOGLEVEL:[log][level]}:\s+%{DATA:app_message} \(OID:%{DATA:[trace][id]}\)$",
          "^%{DATA:raw_ts}\s+%{LOGLEVEL:[log][level]}:\s+%{GREEDYDATA:app_message}$"
        ]
      }
      tag_on_failure => ["_grokparsefailure"]
    }

    if "_grokparsefailure" in [tags] {
      mutate {
        add_field => {
          "[error][source_plugin_id]" => "2002-c2imera-legacy-header-grok-01"
        }
        add_tag => ["_logstash_attributed_grok_parse_failure"]
        remove_tag => ["_grokparsefailure"]
      }
    }

    date {
      id => "2002-c2imera-legacy-date-01"
      match => [ "raw_ts", "yyyyMMddHHmmssSSS" ]
      target => "@timestamp"
      tag_on_failure => ["_dateparsefailure"]
    }

    if "_dateparsefailure" in [tags] {
      mutate {
        add_field => {
          "[error][source_plugin_id]" => "2002-c2imera-legacy-date-01"
        }
        add_tag => ["_logstash_attributed_date_parse_failure"]
        remove_tag => ["_dateparsefailure"]
      }
    }

    # TOPIC 1: NODE (JSON Data)
    if [app_message] =~ /^NODE: \{/ {
      grok {
        id => "2002-c2imera-legacy-node-grok-02"
        match => { "app_message" => "NODE: %{DATA:node_json} \| %{GREEDYDATA:dce_data}" }
        tag_on_failure => ["_grokparsefailure"]
      }

      if "_grokparsefailure" in [tags] {
        mutate {
          add_field => {
            "[error][source_plugin_id]" => "2002-c2imera-legacy-node-grok-02"
          }
          add_tag => ["_logstash_attributed_grok_parse_failure"]
          remove_tag => ["_grokparsefailure"]
        }
      }

      json {
        id => "2002-c2imera-legacy-node-json-01"
        source => "node_json"
        target => "[c2imera][node]"
        tag_on_failure => ["_jsonparsefailure"]
      }

      if "_jsonparsefailure" in [tags] {
        mutate {
          add_field => {
            "[error][source_plugin_id]" => "2002-c2imera-legacy-node-json-01"
          }
          add_tag => ["_logstash_attributed_json_parse_failure"]
          remove_tag => ["_jsonparsefailure"]
        }
      }

      grok {
        id => "2002-c2imera-legacy-dce-grok-03"
        match => { "dce_data" => "DATACHANGEVENT: DataChangeEvent \[id=%{DATA:[c2imera][dce][id]}, workspaceName=%{DATA:[c2imera][workspace]}, createdAt=%{DATA:[c2imera][dce][created_at]}, type=%{DATA:[c2imera][dce][type]}, dataType=%{GREEDYDATA:[c2imera][dce][data_type]}\]" }
        tag_on_failure => ["_grokparsefailure"]
      }

      if "_grokparsefailure" in [tags] {
        mutate {
          add_field => {
            "[error][source_plugin_id]" => "2002-c2imera-legacy-dce-grok-03"
          }
          add_tag => ["_logstash_attributed_grok_parse_failure"]
          remove_tag => ["_grokparsefailure"]
        }
      }

      if [c2imera][node] {
        ruby {
          id => "2002-c2imera-legacy-node-ruby-01"
          code => '
            def to_snake(str); str.gsub(/([a-z\d])([A-Z])/, "\\1_\\2").downcase; end
            def process_hash(h)
              new_h = {}
              h.each do |k, v|
                new_k = to_snake(k)
                if v.is_a?(Hash) then new_h[new_k] = process_hash(v) else new_h[new_k] = v end
              end
              new_h
            end
            node_data = event.get("[c2imera][node]")
            if node_data.is_a?(Hash) then new_data = process_hash(node_data); event.set("[c2imera][node]", new_data) end
          '
          tag_on_exception => "_rubyexception"
        }

        if "_rubyexception" in [tags] or "ruby_exception" in [tags] {
          mutate {
            add_field => {
              "[error][source_plugin_id]" => "2002-c2imera-legacy-node-ruby-01"
            }
            add_tag => ["_logstash_attributed_ruby_exception"]
            remove_tag => ["ruby_exception", "_rubyexception"]
          }
        }
      }

      mutate {
        id => "2002-c2imera-legacy-node-mutate-01"
        add_field => { "[event][action]" => "node-data-change" }
        remove_field => ["node_json", "dce_data"]
      }

      if "_mutate_error" in [tags] {

        mutate {
          add_field => {
            "[error][source_plugin_id]" => "2002-c2imera-legacy-node-mutate-01"
          }
          add_tag => ["_logstash_attributed_mutate_error"]
          remove_tag => ["_mutate_error"]
        }
      }
    }

    # TOPIC 2: User Filters
    else if [app_message] =~ /^createFilterForUser/ {
      grok {
        id => "2002-c2imera-legacy-userfilter-grok-04"
        match => { "app_message" => "createFilterForUser for user \"%{DATA:[user][name]}\" and workspace \"%{DATA:[c2imera][workspace]}\" finished in %{INT:[c2imera][user_filter][duration_ms]} ms" }
        tag_on_failure => ["_grokparsefailure"]
      }

      if "_grokparsefailure" in [tags] {
        mutate {
          add_field => {
            "[error][source_plugin_id]" => "2002-c2imera-legacy-userfilter-grok-04"
          }
          add_tag => ["_logstash_attributed_grok_parse_failure"]
          remove_tag => ["_grokparsefailure"]
        }
      }
      mutate {
        id => "2002-c2imera-legacy-userfilter-mutate-02"
        add_field => { "[event][action]" => "create-filter-for-user" }
        convert => { "[c2imera][user_filter][duration_ms]" => "integer" }
      }

      if "_mutate_error" in [tags] {

        mutate {
          add_field => {
            "[error][source_plugin_id]" => "2002-c2imera-legacy-userfilter-mutate-02"
          }
          add_tag => ["_logstash_attributed_mutate_error"]
          remove_tag => ["_mutate_error"]
        }
      }
    }

    # TOPIC 3: Scheduled Jobs
    else if [app_message] =~ /^Scheduling job/ {
      grok {
        id => "2002-c2imera-legacy-scheduledjob-grok-05"
        match => { "app_message" => "Scheduling job ScheduledJob\{jobId=%{INT:[c2imera][scheduled_job][id]}, jobType='%{DATA:[c2imera][job][type]}', targetObjectId=%{DATA:[c2imera][job][target_id]}, secondaryId='%{DATA:[c2imera][job][secondary_id]}', scheduledTime=%{DATA:[c2imera][job][scheduled_time]}\}" }
        tag_on_failure => ["_grokparsefailure"]
      }

      if "_grokparsefailure" in [tags] {
        mutate {
          add_field => {
            "[error][source_plugin_id]" => "2002-c2imera-legacy-scheduledjob-grok-05"
          }
          add_tag => ["_logstash_attributed_grok_parse_failure"]
          remove_tag => ["_grokparsefailure"]
        }
      }
      mutate {
        id => "2002-c2imera-legacy-scheduledjob-mutate-03"
        add_field => { "[event][action]" => "schedule-job" }
      }

      if "_mutate_error" in [tags] {

        mutate {
          add_field => {
            "[error][source_plugin_id]" => "2002-c2imera-legacy-scheduledjob-mutate-03"
          }
          add_tag => ["_logstash_attributed_mutate_error"]
          remove_tag => ["_mutate_error"]
        }
      }
    }

    # TOPIC 4: Security Context
    else if [app_message] =~ /^filter\(\)/ {
      grok {
        id => "2002-c2imera-legacy-secctx-filter-grok-06"
        match => { "app_message" => "filter\(\) %{DATA:[url][full]} resolved to: DefaultSecurityContext\[user:RestUser\{%{DATA:user_info}\}, roles:\[%{DATA:[user][roles]}\]\]" }
        tag_on_failure => ["_grokparsefailure"]
      }

      if "_grokparsefailure" in [tags] {
        mutate {
          add_field => {
            "[error][source_plugin_id]" => "2002-c2imera-legacy-secctx-filter-grok-06"
          }
          add_tag => ["_logstash_attributed_grok_parse_failure"]
          remove_tag => ["_grokparsefailure"]
        }
      }
      mutate {
        id => "2002-c2imera-legacy-secctx-filter-mutate-04"
        add_field => { "[event][action]" => "security-context-resolved" }
      }

      if "_mutate_error" in [tags] {

        mutate {
          add_field => {
            "[error][source_plugin_id]" => "2002-c2imera-legacy-secctx-filter-mutate-04"
          }
          add_tag => ["_logstash_attributed_mutate_error"]
          remove_tag => ["_mutate_error"]
        }
      }
    }

    else if [app_message] =~ /^Using trusted user:/ {
      grok {
        id => "2002-c2imera-legacy-secctx-trusted-grok-07"
        match => { "app_message" => "Using trusted user:RestUser\{%{DATA:user_info}\} roles:\[%{DATA:[user][roles]}\]\]?" }
        tag_on_failure => ["_grokparsefailure"]
      }

      if "_grokparsefailure" in [tags] {
        mutate {
          add_field => {
            "[error][source_plugin_id]" => "2002-c2imera-legacy-secctx-trusted-grok-07"
          }
          add_tag => ["_logstash_attributed_grok_parse_failure"]
          remove_tag => ["_grokparsefailure"]
        }
      }
      mutate {
        id => "2002-c2imera-legacy-secctx-trusted-mutate-05"
        add_field => { "[event][action]" => "security-context-created" }
      }

      if "_mutate_error" in [tags] {

        mutate {
          add_field => {
            "[error][source_plugin_id]" => "2002-c2imera-legacy-secctx-trusted-mutate-05"
          }
          add_tag => ["_logstash_attributed_mutate_error"]
          remove_tag => ["_mutate_error"]
        }
      }
    }

    # TOPIC 5: EDIT DCE Received
    else if [app_message] =~ /^EDIT DCE received/ {
      grok {
        id => "2002-c2imera-legacy-dce-received-grok-08"
        match => { "app_message" => "EDIT DCE received\. Content Type: \"%{DATA:[c2imera][dce][content_type]}\", Kmeka Msg Key: %{GREEDYDATA:[c2imera][dce][msg_key]}" }
        tag_on_failure => ["_grokparsefailure"]
      }

      if "_grokparsefailure" in [tags] {
        mutate {
          add_field => {
            "[error][source_plugin_id]" => "2002-c2imera-legacy-dce-received-grok-08"
          }
          add_tag => ["_logstash_attributed_grok_parse_failure"]
          remove_tag => ["_grokparsefailure"]
        }
      }
      mutate {
        id => "2002-c2imera-legacy-dce-received-mutate-06"
        add_field => { "[event][action]" => "dce-received" }
      }

      if "_mutate_error" in [tags] {

        mutate {
          add_field => {
            "[error][source_plugin_id]" => "2002-c2imera-legacy-dce-received-mutate-06"
          }
          add_tag => ["_logstash_attributed_mutate_error"]
          remove_tag => ["_mutate_error"]
        }
      }
    }

    # TOPIC 6: Warnings & Errors
    else if [log][level] in ["WARNING", "ERROR"] or [app_message] =~ /^Error -/ {
      mutate {
        id => "2002-c2imera-legacy-error-copy-mutate-07"
        copy => { "[app_message]" => "[event][reason]" }
      }

      if "_mutate_error" in [tags] {

        mutate {
          add_field => {
            "[error][source_plugin_id]" => "2002-c2imera-legacy-error-copy-mutate-07"
          }
          add_tag => ["_logstash_attributed_mutate_error"]
          remove_tag => ["_mutate_error"]
        }
      }

      if [app_message] =~ /No DataObject found on/ {
        grok {
          id => "2002-c2imera-legacy-dataobject-missing-grok-09"
          match => { "app_message" => "No DataObject found on %{DATA:[c2imera][data_object][id]};" }
          tag_on_failure => ["_grokparsefailure"]
        }

        if "_grokparsefailure" in [tags] {
          mutate {
            add_field => {
              "[error][source_plugin_id]" => "2002-c2imera-legacy-dataobject-missing-grok-09"
            }
            add_tag => ["_logstash_attributed_grok_parse_failure"]
            remove_tag => ["_grokparsefailure"]
          }
        }
        mutate {
          id => "2002-c2imera-legacy-dataobject-missing-mutate-08"
          add_field => { "[event][action]" => "data-object-missing" }
        }

        if "_mutate_error" in [tags] {

          mutate {
            add_field => {
              "[error][source_plugin_id]" => "2002-c2imera-legacy-dataobject-missing-mutate-08"
            }
            add_tag => ["_logstash_attributed_mutate_error"]
            remove_tag => ["_mutate_error"]
          }
        }
      }
      else if [app_message] =~ /^Error -/ {
        grok {
          id => "2002-c2imera-legacy-apperror-grok-10"
          match => { "app_message" => "Error - %{DATA:[event][reason]} \(ID:%{DATA:[error][id]}\)" }
          overwrite => [ "[event][reason]" ]
          tag_on_failure => ["_grokparsefailure"]
        }

        if "_grokparsefailure" in [tags] {
          mutate {
            add_field => {
              "[error][source_plugin_id]" => "2002-c2imera-legacy-apperror-grok-10"
            }
            add_tag => ["_logstash_attributed_grok_parse_failure"]
            remove_tag => ["_grokparsefailure"]
          }
        }
        mutate {
          id => "2002-c2imera-legacy-apperror-mutate-09"
          add_field => { "[event][action]" => "application-error" }
        }

        if "_mutate_error" in [tags] {

          mutate {
            add_field => {
              "[error][source_plugin_id]" => "2002-c2imera-legacy-apperror-mutate-09"
            }
            add_tag => ["_logstash_attributed_mutate_error"]
            remove_tag => ["_mutate_error"]
          }
        }
      }
    }

    # TOPIC 7: Scribe Processor
    else if [app_message] =~ /^Using normal scribe processor/ {
      mutate {
        id => "2002-c2imera-legacy-scribe-mutate-10"
        add_field => { "[event][action]" => "scribe-processor-status" }
        copy => { "[app_message]" => "[event][reason]" }
      }

      if "_mutate_error" in [tags] {

        mutate {
          add_field => {
            "[error][source_plugin_id]" => "2002-c2imera-legacy-scribe-mutate-10"
          }
          add_tag => ["_logstash_attributed_mutate_error"]
          remove_tag => ["_mutate_error"]
        }
      }

      if [legacy_class_info] {
        grok {
          id => "2002-c2imera-legacy-scribe-grok-11"
          match => { "legacy_class_info" => "%{JAVACLASS:[log][logger]} %{DATA:[log][origin][function]}" }
          tag_on_failure => ["_grokparsefailure"]
        }

        if "_grokparsefailure" in [tags] {
          mutate {
            add_field => {
              "[error][source_plugin_id]" => "2002-c2imera-legacy-scribe-grok-11"
            }
            add_tag => ["_logstash_attributed_grok_parse_failure"]
            remove_tag => ["_grokparsefailure"]
          }
        }
      }
    }

    # Cleanup Legacy Details
    mutate {
      id => "2002-c2imera-legacy-cleanup-mutate-11"
      remove_field => ["legacy_class_info"]
    }

    if "_mutate_error" in [tags] {

      mutate {
        add_field => {
          "[error][source_plugin_id]" => "2002-c2imera-legacy-cleanup-mutate-11"
        }
        add_tag => ["_logstash_attributed_mutate_error"]
        remove_tag => ["_mutate_error"]
      }
    }
  }


  # required to check the [error][source_config] array as LS evaluation has limitations with arrays
  ruby {
    id => "2002-c2imera-legacy-source-config-fallback"
    code => '
      plugin_ids = event.get("[error][source_plugin_id]")
      if plugin_ids
        ids_array = plugin_ids.is_a?(Array) ? plugin_ids : [plugin_ids]
        has_match = ids_array.any? { |id| id.to_s.start_with?("2002-c2imera") }
        if has_match
          configs = event.get("[error][source_config]")
          configs_array = configs.nil? ? [] : (configs.is_a?(Array) ? configs : [configs])
          unless configs_array.include?("2002-c2imera-legacy.conf")
            event.set("[_temp][config_boolean]", "true")
          end
        end
      end
    '
  }

  # paired with the ruby above to append the [error][source_config] and not just replace exisiting values
  if [_temp][config_boolean] == "true" {
    mutate {
      add_field => {
        "[error][source_config]" => "2002-c2imera-legacy.conf"
      }
      remove_field => ["[_temp]"]
    }
  }
}

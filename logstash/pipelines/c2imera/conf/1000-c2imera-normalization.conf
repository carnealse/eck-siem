filter {
  # =============================================================================
  # STAGE 1A: THE GATEKEEPER (Noise Reduction)
  # =============================================================================

  # Grouping drops for better scannability and performance
  if [message] =~ /^docker stats/ or
     [message] =~ /^disk stats output:/ or
     [message] =~ /^\d+ \[.*(memory|disk)\]/ or
     [message] =~ /^\s+at / or
     [message] =~ /^\(OID:-\)\s*$/ or
     [message] =~ /^[\d\.]+[MG] [\d\.]+[MG]/ or
     [message] =~ /^ecs-/ or
     [message] =~ /^crond:/ or
     [message] =~ /^formatted data:/ or
     [message] =~ /(Heartbeat:|\[JVM|\[Memory|GC stats:|C3P0 stats:|JVM Thread Count:)/ or
     [message] =~ /HTTP\/\d\.\d/ or
     [message] =~ /(getWorkspaceConfigurationValue|stream-thread)/ or
     [message] =~ "UserConfigDataAccessLayer" {

    drop {}
  }

  # =============================================================================
  # SECURITY: Password Redaction
  # =============================================================================
  if [message] =~ /"password"/ or [message] =~ /PASSWORD/ {
    mutate {
      id => "1000-c2imera-password-redaction-mutate-01"
      gsub => [
        "message", '"password"\s*:\s*"[^"]*"', '"password":"[REDACTED]"',
        "message", 'PASSWORD\s*=\s*"[^"]*"', 'PASSWORD="[REDACTED]"'
      ]
    }

    if "_mutate_error" in [tags] {

      mutate {
        add_field => {
          "[error][source_plugin_id]" => "1000-c2imera-password-redaction-mutate-01"
        }
        add_tag => ["_logstash_attributed_mutate_error"]
        remove_tag => ["_mutate_error"]
      }
    }
  }

  # Preserve the message before parsing as per ECS standards
  mutate {
    replace => { "[event][original]" => "%{message}" }
    id => "1000-c2imera-preserve-original-message-mutate-02"
  }

  if "_mutate_error" in [tags] {

    mutate {
      add_field => {
        "[error][source_plugin_id]" => "1000-c2imera-preserve-original-message-mutate-02"
      }
      add_tag => ["_logstash_attributed_mutate_error"]
      remove_tag => ["_mutate_error"]
    }
  }

  # =============================================================================
  # STAGE 1B: TRAFFIC CONTROL (Lane Routing)
  # =============================================================================

  # Priority 1: Java & Legacy (17-digit Timestamp)
  if [message] =~ /^\d{17}\s+[\w\.]+\s+(INFO|WARNING|FINE|ERROR|DEBUG)/ {
    mutate {
      add_field => { "[@metadata][log_lane]" => "java_lane" }
      id => "1000-c2imera-route-to-java-mutate-03"
    }

    if "_mutate_error" in [tags] {

      mutate {
        add_field => {
          "[error][source_plugin_id]" => "1000-c2imera-route-to-java-mutate-03"
        }
        add_tag => ["_logstash_attributed_mutate_error"]
        remove_tag => ["_mutate_error"]
      }
    }
  }
  else if [message] =~ /^\d{17}\s+(INFO|WARNING|ERROR):/ {
    mutate {
      add_field => { "[@metadata][log_lane]" => "legacy_lane" }
      id => "1000-c2imera-route-to-legacy-mutate-04"
    }

    if "_mutate_error" in [tags] {

      mutate {
        add_field => {
          "[error][source_plugin_id]" => "1000-c2imera-route-to-legacy-mutate-04"
        }
        add_tag => ["_logstash_attributed_mutate_error"]
        remove_tag => ["_mutate_error"]
      }
    }
  }
  # Priority 2: Audit & Syslog
  else if [message] =~ /^[A-Z][a-z]{2}\s+\d+/ or [message] =~ /\bmsg=audit\(/ or [message] =~ /type=[A-Z_]+/ {
    mutate {
      add_field => { "[@metadata][log_lane]" => "audit_lane" }
      id => "1000-c2imera-route-to-audit-mutate-05"
    }

    if "_mutate_error" in [tags] {

      mutate {
        add_field => {
          "[error][source_plugin_id]" => "1000-c2imera-route-to-audit-mutate-05"
        }
        add_tag => ["_logstash_attributed_mutate_error"]
        remove_tag => ["_mutate_error"]
      }
    }
  }
  else {
    mutate {
      add_field => { "[@metadata][log_lane]" => "unknown" }
      id => "1000-c2imera-route-to-unknown-mutate-06"
    }

    if "_mutate_error" in [tags] {

      mutate {
        add_field => {
          "[error][source_plugin_id]" => "1000-c2imera-route-to-unknown-mutate-06"
        }
        add_tag => ["_logstash_attributed_mutate_error"]
        remove_tag => ["_mutate_error"]
      }
    }
  }


  # required to check the [error][source_config] array as LS evaluation has limitations with arrays
  ruby {
    id => "1000-c2imera-normalization-source-config-fallback"
    code => '
      plugin_ids = event.get("[error][source_plugin_id]")
      if plugin_ids
        ids_array = plugin_ids.is_a?(Array) ? plugin_ids : [plugin_ids]
        has_match = ids_array.any? { |id| id.to_s.start_with?("1000-c2imera") }
        if has_match
          configs = event.get("[error][source_config]")
          configs_array = configs.nil? ? [] : (configs.is_a?(Array) ? configs : [configs])
          unless configs_array.include?("1000-c2imera-normalization.conf")
            event.set("[_temp][config_boolean]", "true")
          end
        end
      end
    '
  }

  if [_temp][config_boolean] == "true" {
    mutate {
      add_field => {
        "[error][source_config]" => "1000-c2imera-normalization.conf"
      }
      remove_field => ["[_temp]"]
    }
  }
}

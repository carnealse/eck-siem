output {
  if [@metadata][routing_path] == "error_index" {
    pipeline {
      id => "9000-c2imera-output-error"
      send_to => "error-handling"
    }
  } else {
    elasticsearch {
      id => "9000-c2imera-output-standard"
      data_stream => true
      data_stream_type => "logs"
      data_stream_dataset => "c2imera"
      data_stream_namespace => "c2imera"
      hosts => [ "${ELASTICSEARCH_ES_HOSTS}" ]
      user => "${ELASTICSEARCH_ES_USER}"
      password => "${ELASTICSEARCH_ES_PASSWORD}"
      ssl_enabled => true
      ssl_certificate_authorities => "${ELASTICSEARCH_ES_SSL_CERTIFICATE_AUTHORITY}"
      pipeline => "c2imera-router"
    }
  }
}

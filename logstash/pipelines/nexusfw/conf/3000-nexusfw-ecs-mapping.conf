filter {
  # ---------------------------------------------------------------------------------
  # PHASE 3: ECS Normalization
  # ---------------------------------------------------------------------------------

  # DATE PARSING
  if [@metadata][timestamp_raw] {
    if [@metadata][log_type] == "access" {
      date {
        match => [ "[@metadata][timestamp_raw]", "dd/MMM/yyyy:HH:mm:ss Z" ]
        target => "@timestamp"
        id => "3000-nexusfw-date-access"
      }

      if "_dateparsefailure" in [tags] and ![error][source_plugin_id] {
        mutate {
          add_field => {
            "[error][source_config]"    => "3000-nexusfw-ecs-mapping.conf"
            "[error][source_plugin_id]" => "3000-nexusfw-date-access"
          }
        }
      }
    } else if [@metadata][log_type] == "app" {
      date {
        match => [ "[@metadata][timestamp_raw]", "yyyy-MM-dd HH:mm:ss,SSSZ" ]
        target => "@timestamp"
        id => "3000-nexusfw-date-app"
      }

      if "_dateparsefailure" in [tags] and ![error][source_plugin_id] {
        mutate {
          add_field => {
            "[error][source_config]"    => "3000-nexusfw-ecs-mapping.conf"
            "[error][source_plugin_id]" => "3000-nexusfw-date-app"
          }
        }
      }
    }
  }

  # USER AGENT PARSING (Access Logs Only)
  if [@metadata][log_type] == "access" and [user_agent][original] {
    useragent {
      source => "[user_agent][original]"
      target => "user_agent"
      id => "3000-nexusfw-ua-parsing"
    }
  }

  # NULL HANDLING
  if [user][name] == "-" {
    mutate {
      remove_field => [ "[user][name]" ]
      id => "3000-nexusfw-cleanup-dash-user"
    }

    if "_mutate_error" in [tags] and ![error][source_plugin_id] {
      mutate {
        add_field => {
          "[error][source_config]"    => "3000-nexusfw-ecs-mapping.conf"
          "[error][source_plugin_id]" => "3000-nexusfw-cleanup-dash-user"
        }
      }
    }
  }
}

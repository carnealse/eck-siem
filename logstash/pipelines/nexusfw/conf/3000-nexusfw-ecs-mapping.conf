filter {
  # ---------------------------------------------------------------------------------
  # PHASE 3: ECS Normalization
  # ---------------------------------------------------------------------------------

  # DATE PARSING
  if [@metadata][timestamp_raw] {
    if [@metadata][log_type] == "access" {
      date {
        match => [ "[@metadata][timestamp_raw]", "dd/MMM/yyyy:HH:mm:ss Z" ]
        target => "@timestamp"
        id => "3000-nexusfw-date-access-date-01"
        tag_on_failure => ["_dateparsefailure"]
      }

      if "_dateparsefailure" in [tags] {
        mutate {
          add_field => {
            "[error][source_plugin_id]" => "3000-nexusfw-date-access-date-01"
          }
          add_tag => ["_logstash_attributed_date_parse_failure"]
          remove_tag => ["_dateparsefailure"]
        }
      }
    } else if [@metadata][log_type] == "app" {
      date {
        match => [ "[@metadata][timestamp_raw]", "yyyy-MM-dd HH:mm:ss,SSSZ" ]
        target => "@timestamp"
        id => "3000-nexusfw-date-app-date-02"
        tag_on_failure => ["_dateparsefailure"]
      }

      if "_dateparsefailure" in [tags] {
        mutate {
          add_field => {
            "[error][source_plugin_id]" => "3000-nexusfw-date-app-date-02"
          }
          add_tag => ["_logstash_attributed_date_parse_failure"]
          remove_tag => ["_dateparsefailure"]
        }
      }
    }
  }

  # USER AGENT PARSING (Access Logs Only)
  if [@metadata][log_type] == "access" and [user_agent][original] {
    useragent {
      source => "[user_agent][original]"
      target => "user_agent"
      id => "3000-nexusfw-ua-parsing"
    }
  }

  # NULL HANDLING
  if [user][name] == "-" {
    mutate {
      remove_field => [ "[user][name]" ]
      id => "3000-nexusfw-cleanup-dash-user-mutate-01"
    }

    if "_mutate_error" in [tags] {

      mutate {
        add_field => {
          "[error][source_plugin_id]" => "3000-nexusfw-cleanup-dash-user-mutate-01"
        }
        add_tag => ["_logstash_attributed_mutate_error"]
        remove_tag => ["_mutate_error"]
      }
    }
  }


  # required to check the [error][source_config] array as LS evaluation has limitations with arrays
  ruby {
    id => "3000-nexusfw-ecs-mapping-source-config-fallback"
    code => '
      plugin_ids = event.get("[error][source_plugin_id]")
      if plugin_ids
        ids_array = plugin_ids.is_a?(Array) ? plugin_ids : [plugin_ids]
        has_match = ids_array.any? { |id| id.to_s.start_with?("3000-nexusfw") }
        if has_match
          configs = event.get("[error][source_config]")
          configs_array = configs.nil? ? [] : (configs.is_a?(Array) ? configs : [configs])
          unless configs_array.include?("3000-nexusfw-ecs-mapping.conf")
            event.set("[_temp][config_boolean]", "true")
          end
        end
      end
    '
  }

  # paired with the ruby above to append the [error][source_config] and not just replace exisiting values
  if [_temp][config_boolean] == "true" {
    mutate {
      add_field => {
        "[error][source_config]" => "3000-nexusfw-ecs-mapping.conf"
      }
      remove_field => ["[_temp]"]
    }
  }
}

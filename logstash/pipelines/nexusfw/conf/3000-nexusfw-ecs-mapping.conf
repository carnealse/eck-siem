filter {
  # ---------------------------------------------------------------------------------
  # PHASE 3: ECS Normalization
  # ---------------------------------------------------------------------------------

  # DATE PARSING
  if [@metadata][timestamp_raw] {
    if [@metadata][log_type] == "access" {
      date {
        match => [ "[@metadata][timestamp_raw]", "dd/MMM/yyyy:HH:mm:ss Z" ]
        target => "@timestamp"
        id => "3000-nexusfw-date-access-date-01"
        tag_on_failure => ["_dateparsefailure", "_logstash_failure__3000-nexusfw-ecs-mapping__date__3000-nexusfw-date-access-date-01"]
      }

      if "_logstash_failure__3000-nexusfw-ecs-mapping__date__3000-nexusfw-date-access-date-01" in [tags] {
        mutate {
          add_field => {
            "[error][source_config]"    => "3000-nexusfw-ecs-mapping.conf"
            "[error][source_plugin_id]" => "3000-nexusfw-date-access-date-01"
          }
        }
      }
    } else if [@metadata][log_type] == "app" {
      date {
        match => [ "[@metadata][timestamp_raw]", "yyyy-MM-dd HH:mm:ss,SSSZ" ]
        target => "@timestamp"
        id => "3000-nexusfw-date-app-date-02"
        tag_on_failure => ["_dateparsefailure", "_logstash_failure__3000-nexusfw-ecs-mapping__date__3000-nexusfw-date-app-date-02"]
      }

      if "_logstash_failure__3000-nexusfw-ecs-mapping__date__3000-nexusfw-date-app-date-02" in [tags] {
        mutate {
          add_field => {
            "[error][source_config]"    => "3000-nexusfw-ecs-mapping.conf"
            "[error][source_plugin_id]" => "3000-nexusfw-date-app-date-02"
          }
        }
      }
    }
  }

  # USER AGENT PARSING (Access Logs Only)
  if [@metadata][log_type] == "access" and [user_agent][original] {
    useragent {
      source => "[user_agent][original]"
      target => "user_agent"
      id => "3000-nexusfw-ua-parsing"
    }
  }

  # NULL HANDLING
  if [user][name] == "-" {
    mutate {
      remove_field => [ "[user][name]" ]
      id => "3000-nexusfw-cleanup-dash-user-mutate-01"
    }

    if "_mutate_error" in [tags] {
      mutate {
        add_field => {
          "[error][source_config]"    => "3000-nexusfw-ecs-mapping.conf"
          "[error][source_plugin_id]" => "3000-nexusfw-cleanup-dash-user-mutate-01"
        }
        add_tag => ["_logstash_failure__3000-nexusfw-ecs-mapping__mutate__3000-nexusfw-cleanup-dash-user-mutate-01", "_logstash_attributed_mutate_error"]
        remove_tag => ["_mutate_error"]
      }
    }
  }
}

filter {
  # ---------------------------------------------------------------------------------
  # PHASE 4: FINAL CLEANUP
  # ---------------------------------------------------------------------------------
  mutate {
    remove_field => [ "[@metadata][timestamp_raw]", "message" ]
    id => "6000-nexusfw-final-cleanup-mutate-01"
  }

  if "_mutate_error" in [tags] {
    if ![error][source_config] {
      mutate {
        add_field => {
          "[error][source_config]" => "6000-nexusfw-cleanup.conf"
        }
      }
    }

    mutate {
      add_field => {
        "[error][source_plugin_id]" => "6000-nexusfw-final-cleanup-mutate-01"
      }
      add_tag => ["_logstash_attributed_mutate_error"]
      remove_tag => ["_mutate_error"]
    }
  }
}

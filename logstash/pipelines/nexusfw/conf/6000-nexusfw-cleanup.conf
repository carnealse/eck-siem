filter {
  # ---------------------------------------------------------------------------------
  # PHASE 4: FINAL CLEANUP
  # ---------------------------------------------------------------------------------
  mutate {
    remove_field => [ "[@metadata][timestamp_raw]", "message" ]
    id => "6000-nexusfw-final-cleanup"
  }

  if "_mutate_error" in [tags] {
    mutate {
      add_field => {
        "[error][source_config]"    => "6000-nexusfw-cleanup.conf"
        "[error][source_plugin_id]" => "6000-nexusfw-final-cleanup"
      }
      add_tag => ["_logstash_failure__6000-nexusfw-cleanup__mutate__6000-nexusfw-final-cleanup", "_logstash_attributed_mutate_error"]
      remove_tag => ["_mutate_error"]
    }
  }
}

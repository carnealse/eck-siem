filter {
  # ---------------------------------------------------------------------------------
  # PHASE 4: FINAL CLEANUP
  # ---------------------------------------------------------------------------------
  mutate {
    remove_field => [ "[@metadata][timestamp_raw]", "message" ]
    id => "6000-nexusfw-final-cleanup-mutate-01"
  }

  if "_mutate_error" in [tags] {
    if ![error][source_config] {
      mutate {
        add_field => {
          "[error][source_config]" => "6000-nexusfw-cleanup.conf"
        }
      }
    }

    if [error][source_plugin_id] {
      mutate {
        update => {
          "[error][source_plugin_id]" => "%{[error][source_plugin_id]} | 6000-nexusfw-final-cleanup-mutate-01"
        }
      add_tag => ["_logstash_failure__6000-nexusfw-cleanup__mutate__6000-nexusfw-final-cleanup-mutate-01", "_logstash_attributed_mutate_error"]
      remove_tag => ["_mutate_error"]
      }
    } else {
      mutate {
        add_field => {
          "[error][source_plugin_id]" => "6000-nexusfw-final-cleanup-mutate-01"
        }
      add_tag => ["_logstash_failure__6000-nexusfw-cleanup__mutate__6000-nexusfw-final-cleanup-mutate-01", "_logstash_attributed_mutate_error"]
      remove_tag => ["_mutate_error"]
      }
    }
  }
}

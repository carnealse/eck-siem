filter {
  # ---------------------------------------------------------------------------------
  # PHASE 2: Channel Processing
  # ---------------------------------------------------------------------------------

  # === CHANNEL A: ACCESS LOGS ===
  if [@metadata][log_type] == "access" {

    # Tier 1: strict parse — full field extraction
    grok {
      match => {
        "message" => '%{IPORHOST:[source][ip]} - %{DATA:[user][name]} \[%{HTTPDATE:[@metadata][timestamp_raw]}\] "%{WORD:[http][request][method]} %{DATA:[url][original]} HTTP/%{NUMBER:[http][version]}" %{NUMBER:[http][response][status_code]} %{NUMBER:[http][response][body][bytes]} %{NUMBER:[event][duration]} "%{DATA:[user_agent][original]}"'
      }
      tag_on_failure => ["_nexusfw_access_strict_failure"]
      id => "2000-nexusfw-grok-access-strict"
    }

    # Tier 2: lenient parse — fires only if strict failed, captures minimum viable fields
    # If this also fails it is a genuine pipeline problem and _grokparsefailure will fire
    if "_nexusfw_access_strict_failure" in [tags] {
      grok {
        match => {
          "message" => '%{IPORHOST:[source][ip]} - %{DATA:[user][name]} \[%{HTTPDATE:[@metadata][timestamp_raw]}\] %{GREEDYDATA:[nexusfw][raw_request]}'
        }
        tag_on_failure => ["_grokparsefailure"]
        id => "2000-nexusfw-grok-access-lenient-grok-01"
      }

      if "_grokparsefailure" in [tags] {
        mutate {
          add_field => {
            "[error][source_plugin_id]" => "2000-nexusfw-grok-access-lenient-grok-01"
          }
          add_tag => ["_logstash_attributed_grok_parse_failure"]
          remove_tag => ["_grokparsefailure"]
        }
      }
    }

    # Extract query params if present
    if [url][original] {
      grok {
        match => { "[url][original]" => "%{DATA:[url][path]}\?%{GREEDYDATA:[url][query]}" }
        tag_on_failure => []
        id => "2000-nexusfw-grok-url-parts"
      }
    }

    # ECS Categorization for Web Traffic
    mutate {
      add_field => { "[event][category]" => "web" }
      add_field => { "[event][kind]" => "event" }
      add_field => { "[event][type]" => "access" }
      add_field => { "[event][outcome]" => "success" }
      id => "2000-nexusfw-mutate-access-ecs-mutate-01"
    }

    if "_mutate_error" in [tags] {

      mutate {
        add_field => {
          "[error][source_plugin_id]" => "2000-nexusfw-mutate-access-ecs-mutate-01"
        }
        add_tag => ["_logstash_attributed_mutate_error"]
        remove_tag => ["_mutate_error"]
      }
    }
  }

  # === CHANNEL B: APPLICATION LOGS ===
  if [@metadata][log_type] == "app" {
    grok {
      # Parsing Nexus/Shiro/Quartz Application logs.
      # Capturing the descriptive text into [event][reason].
      # Pattern: Timestamp Level [Thread] (Optional User) Logger - Reason
      match => {
        "message" => '%{TIMESTAMP_ISO8601:[@metadata][timestamp_raw]}\s+%{LOGLEVEL:[log][level]}\s+\[%{DATA:[process][thread][name]}\]\s+(?:%{NOTSPACE:[user][name]}\s+)?%{JAVACLASS:[log][logger]}\s+-\s+%{GREEDYDATA:[event][reason]}'
      }
      # Note: We are NOT overwriting 'message' here so the original raw log is preserved in 'message',
      # while the specific parsed text goes to [event][reason].
      id => "2000-nexusfw-grok-app-grok-02"
      tag_on_failure => ["_grokparsefailure"]
    }

    if "_grokparsefailure" in [tags] {
      mutate {
        add_field => {
          "[error][source_plugin_id]" => "2000-nexusfw-grok-app-grok-02"
        }
        add_tag => ["_logstash_attributed_grok_parse_failure"]
        remove_tag => ["_grokparsefailure"]
      }
    }

    # ECS Categorization for App Logs
    mutate {
      add_field => { "[event][category]" => "process" }
      add_field => { "[event][kind]" => "event" }
      id => "2000-nexusfw-mutate-app-ecs-mutate-02"
    }

    if "_mutate_error" in [tags] {

      mutate {
        add_field => {
          "[error][source_plugin_id]" => "2000-nexusfw-mutate-app-ecs-mutate-02"
        }
        add_tag => ["_logstash_attributed_mutate_error"]
        remove_tag => ["_mutate_error"]
      }
    }
  }


  # required to check the [error][source_config] array as LS evaluation has limitations with arrays
  ruby {
    id => "2000-nexusfw-main-parse-source-config-fallback"
    code => '
      plugin_ids = event.get("[error][source_plugin_id]")
      if plugin_ids
        ids_array = plugin_ids.is_a?(Array) ? plugin_ids : [plugin_ids]
        has_match = ids_array.any? { |id| id.to_s.start_with?("2000-nexusfw") }
        if has_match
          configs = event.get("[error][source_config]")
          configs_array = configs.nil? ? [] : (configs.is_a?(Array) ? configs : [configs])
          unless configs_array.include?("2000-nexusfw-main-parse.conf")
            event.set("[_temp][config_boolean]", "true")
          end
        end
      end
    '
  }

  # paired with the ruby above to append the [error][source_config] and not just replace exisiting values
  if [_temp][config_boolean] == "true" {
    mutate {
      add_field => {
        "[error][source_config]" => "2000-nexusfw-main-parse.conf"
      }
      remove_field => ["[_temp]"]
    }
  }
}

filter {
  ruby {
    id => "2000-vpcflow-ruby-token-count-ruby-01"
    code => '
      original = event.get("[event][original]")
      if original.is_a?(Array)
        original = original.first
      end
      original = original.to_s
      # Normalize non-ASCII whitespace (e.g. U+00A0 NBSP from Windows/S3/console) to ASCII space.
      # Ruby \s does not treat NBSP as whitespace, which otherwise yields token count 1 and skips all dissect branches.
      original = original.gsub(/[\u00A0\u1680\u180E\u2000-\u200B\u202F\u205F\u3000\uFEFF]/, " ")
      original = original.strip.gsub(/[ \t]+/, " ")
      event.set("[event][original]", original)
      count = original.empty? ? 0 : original.split(" ").length
      event.set("[_temp][message_token_count]", count)
    '
    tag_on_exception => "_rubyexception"
  }

  if "_rubyexception" in [tags] or "ruby_exception" in [tags] {
    mutate {
      add_field => {
        "[error][source_plugin_id]" => "2000-vpcflow-ruby-token-count-ruby-01"
      }
      add_tag => ["_logstash_attributed_ruby_exception"]
      remove_tag => ["ruby_exception", "_rubyexception"]
    }
  }

  if [_temp][message_token_count] == 14 {
    dissect {
      mapping => {
        "[event][original]" => "%{[aws][vpcflow][version]} %{[aws][vpcflow][account_id]} %{[aws][vpcflow][interface_id]} %{[aws][vpcflow][srcaddr]} %{[aws][vpcflow][dstaddr]} %{[aws][vpcflow][srcport]} %{[aws][vpcflow][dstport]} %{[aws][vpcflow][protocol]} %{[aws][vpcflow][packets]} %{[aws][vpcflow][bytes]} %{[aws][vpcflow][start]} %{[aws][vpcflow][end]} %{[aws][vpcflow][action]} %{[aws][vpcflow][log_status]}"
      }
      id => "2000-vpcflow-dissect-14-dissect-01"
      tag_on_failure => ["_dissectfailure"]
    }

    if "_dissectfailure" in [tags] {
      mutate {
        add_field => {
          "[error][source_plugin_id]" => "2000-vpcflow-dissect-14-dissect-01"
        }
        add_tag => ["_logstash_attributed_dissect_failure"]
        remove_tag => ["_dissectfailure"]
      }
    }
  }

  if [_temp][message_token_count] == 6 {
    dissect {
      mapping => {
        "[event][original]" => "%{[aws][vpcflow][instance_id]} %{[aws][vpcflow][interface_id]} %{[aws][vpcflow][srcaddr]} %{[aws][vpcflow][dstaddr]} %{[aws][vpcflow][pkt_srcaddr]} %{[aws][vpcflow][pkt_dstaddr]}"
      }
      id => "2000-vpcflow-dissect-6-dissect-02"
      tag_on_failure => ["_dissectfailure"]
    }

    if "_dissectfailure" in [tags] {
      mutate {
        add_field => {
          "[error][source_plugin_id]" => "2000-vpcflow-dissect-6-dissect-02"
        }
        add_tag => ["_logstash_attributed_dissect_failure"]
        remove_tag => ["_dissectfailure"]
      }
    }
  }

  if [_temp][message_token_count] == 17 {
    dissect {
      mapping => {
        "[event][original]" => "%{[aws][vpcflow][version]} %{[aws][vpcflow][interface_id]} %{[aws][vpcflow][account_id]} %{[aws][vpcflow][vpc_id]} %{[aws][vpcflow][subnet_id]} %{[aws][vpcflow][instance_id]} %{[aws][vpcflow][srcaddr]} %{[aws][vpcflow][dstaddr]} %{[aws][vpcflow][srcport]} %{[aws][vpcflow][dstport]} %{[aws][vpcflow][protocol]} %{[aws][vpcflow][tcp_flags]} %{[aws][vpcflow][type]} %{[aws][vpcflow][pkt_srcaddr]} %{[aws][vpcflow][pkt_dstaddr]} %{[aws][vpcflow][action]} %{[aws][vpcflow][log_status]}"
      }
      id => "2000-vpcflow-dissect-17-dissect-03"
      tag_on_failure => ["_dissectfailure"]
    }

    if "_dissectfailure" in [tags] {
      mutate {
        add_field => {
          "[error][source_plugin_id]" => "2000-vpcflow-dissect-17-dissect-03"
        }
        add_tag => ["_logstash_attributed_dissect_failure"]
        remove_tag => ["_dissectfailure"]
      }
    }
  }

  if [_temp][message_token_count] == 21 {
    dissect {
      mapping => {
        "[event][original]" => "%{[aws][vpcflow][version]} %{[aws][vpcflow][vpc_id]} %{[aws][vpcflow][subnet_id]} %{[aws][vpcflow][instance_id]} %{[aws][vpcflow][interface_id]} %{[aws][vpcflow][account_id]} %{[aws][vpcflow][type]} %{[aws][vpcflow][srcaddr]} %{[aws][vpcflow][dstaddr]} %{[aws][vpcflow][srcport]} %{[aws][vpcflow][dstport]} %{[aws][vpcflow][pkt_srcaddr]} %{[aws][vpcflow][pkt_dstaddr]} %{[aws][vpcflow][protocol]} %{[aws][vpcflow][bytes]} %{[aws][vpcflow][packets]} %{[aws][vpcflow][start]} %{[aws][vpcflow][end]} %{[aws][vpcflow][action]} %{[aws][vpcflow][tcp_flags]} %{[aws][vpcflow][log_status]}"
      }
      id => "2000-vpcflow-dissect-21-dissect-04"
      tag_on_failure => ["_dissectfailure"]
    }

    if "_dissectfailure" in [tags] {
      mutate {
        add_field => {
          "[error][source_plugin_id]" => "2000-vpcflow-dissect-21-dissect-04"
        }
        add_tag => ["_logstash_attributed_dissect_failure"]
        remove_tag => ["_dissectfailure"]
      }
    }
  }

  if [_temp][message_token_count] == 29 {
    dissect {
      mapping => {
        "[event][original]" => "%{[aws][vpcflow][version]} %{[aws][vpcflow][account_id]} %{[aws][vpcflow][interface_id]} %{[aws][vpcflow][srcaddr]} %{[aws][vpcflow][dstaddr]} %{[aws][vpcflow][srcport]} %{[aws][vpcflow][dstport]} %{[aws][vpcflow][protocol]} %{[aws][vpcflow][packets]} %{[aws][vpcflow][bytes]} %{[aws][vpcflow][start]} %{[aws][vpcflow][end]} %{[aws][vpcflow][action]} %{[aws][vpcflow][log_status]} %{[aws][vpcflow][vpc_id]} %{[aws][vpcflow][subnet_id]} %{[aws][vpcflow][instance_id]} %{[aws][vpcflow][tcp_flags]} %{[aws][vpcflow][type]} %{[aws][vpcflow][pkt_srcaddr]} %{[aws][vpcflow][pkt_dstaddr]} %{[cloud][region]} %{[cloud][availability_zone]} %{[aws][vpcflow][sublocation][type]} %{[aws][vpcflow][sublocation][id]} %{[aws][vpcflow][pkt_src_service]} %{[aws][vpcflow][pkt_dst_service]} %{[network][direction]} %{[aws][vpcflow][traffic_path]}"
      }
      id => "2000-vpcflow-dissect-29-dissect-05"
      tag_on_failure => ["_dissectfailure"]
    }

    if "_dissectfailure" in [tags] {
      mutate {
        add_field => {
          "[error][source_plugin_id]" => "2000-vpcflow-dissect-29-dissect-05"
        }
        add_tag => ["_logstash_attributed_dissect_failure"]
        remove_tag => ["_dissectfailure"]
      }
    }
  }

  if [_temp][message_token_count] == 40 {
    # Tier 1: strict pattern
    grok {
      match => {
        "[event][original]" => "%{NOTSPACE:[aws][vpcflow][account_id]} %{DATA:[aws][vpcflow][action]} %{DATA:[cloud][availability_zone]} %{NOTSPACE:[aws][vpcflow][extra]} %{DATA:[aws][vpcflow][srcaddr]} %{DATA:[aws][vpcflow][srcport]} %{NOTSPACE:[aws][vpcflow][start]} %{NOTSPACE:[aws][vpcflow][direction]} %{NOTSPACE:[aws][vpcflow][instance_id]} %{GREEDYDATA:[aws][vpcflow][interface_id]} %{DATA:[aws][vpcflow][log_status]} %{NOTSPACE:[aws][vpcflow][packets]} %{DATA:[aws][vpcflow][bytes_field]} %{NOTSPACE:[aws][vpcflow][srcaddr_dup]} %{NOTSPACE:[aws][vpcflow][placeholder1]} %{NOTSPACE:[aws][vpcflow][dstaddr]} %{NOTSPACE:[aws][vpcflow][protocol]} %{DATA:[cloud][region]} %{NOTSPACE:[placeholder2]} %{NOTSPACE:[aws][vpcflow][dstaddr_dup]} %{NOTSPACE:[aws][vpcflow][dstport]} %{NOTSPACE:[aws][vpcflow][end]} %{NOTSPACE:[aws][placeholder3]} %{NOTSPACE:[aws][placeholder4]} %{NOTSPACE:[aws][vpcflow][subnet_id]} %{NOTSPACE:[aws][vpcflow][bytes]} %{NOTSPACE:[aws][placeholder5]} %{DATA:[aws][vpcflow][type]} %{NOTSPACE:[aws][vpcflow][tcp_flags]} %{NOTSPACE:[aws][vpcflow][vpc_id]} %{NOTSPACE:[aws][placeholder6]} %{NOTSPACE:[aws][placeholder7]} %{NOTSPACE:[aws][placeholder8]} %{NOTSPACE:[aws][placeholder9]} %{NOTSPACE:[aws][placeholder10]} %{NOTSPACE:[aws][placeholder11]} %{NOTSPACE:[aws][placeholder12]} %{NOTSPACE:[aws][placeholder13]} %{NOTSPACE:[aws][placeholder14]} %{NOTSPACE:[aws][placeholder15]}"
      }
      tag_on_failure => ["_vpcflow_40_strict_failure"]
      id => "2000-vpcflow-grok-40-strict"
    }

    # Tier 2: only fires if strict failed
    # If this also fails it is a genuine pipeline problem and _grokparsefailure will fire
    if "_vpcflow_40_strict_failure" in [tags] {
      grok {
        match => {
          "[event][original]" => "%{DATA:[aws][vpcflow][account_id]} %{DATA:[aws][vpcflow][action]} %{DATA:[cloud][availability_zone]} %{NOTSPACE:[aws][vpcflow][extra]} %{DATA:[aws][vpcflow][srcaddr]} %{DATA:[aws][vpcflow][srcport]} %{NOTSPACE:[aws][vpcflow][start]} %{DATA:[aws][vpcflow][direction]} %{NOTSPACE:[aws][vpcflow][instance_id]} %{DATA:[aws][vpcflow][interface_id]} %{DATA:[aws][vpcflow][log_status]} %{NOTSPACE:[aws][vpcflow][packets]} %{DATA:[aws][vpcflow][bytes_field]} %{NOTSPACE:[aws][vpcflow][srcaddr_dup]} %{NOTSPACE:[aws][vpcflow][placeholder1]} %{NOTSPACE:[aws][vpcflow][dstaddr]} %{NOTSPACE:[aws][vpcflow][protocol]} %{DATA:[cloud][region]} %{NOTSPACE:[placeholder2]} %{NOTSPACE:[aws][vpcflow][dstaddr_dup]} %{NOTSPACE:[aws][vpcflow][dstport]} %{NOTSPACE:[aws][vpcflow][end]} %{NOTSPACE:[aws][placeholder3]} %{NOTSPACE:[aws][placeholder4]} %{NOTSPACE:[aws][vpcflow][subnet_id]} %{NOTSPACE:[aws][vpcflow][bytes]} %{NOTSPACE:[aws][placeholder5]} %{DATA:[aws][vpcflow][type]} %{NOTSPACE:[aws][vpcflow][tcp_flags]} %{NOTSPACE:[aws][vpcflow][vpc_id]} %{NOTSPACE:[aws][placeholder6]} %{NOTSPACE:[aws][placeholder7]} %{NOTSPACE:[aws][placeholder8]} %{NOTSPACE:[aws][placeholder9]} %{NOTSPACE:[aws][placeholder10]} %{NOTSPACE:[aws][placeholder11]} %{NOTSPACE:[aws][placeholder12]} %{NOTSPACE:[aws][placeholder13]} %{NOTSPACE:[aws][placeholder14]} %{NOTSPACE:[aws][placeholder15]}"
        }
        tag_on_failure => ["_grokparsefailure"]
        id => "2000-vpcflow-grok-40-lenient-grok-01"
      }

      if "_grokparsefailure" in [tags] {
        mutate {
          add_field => {
            "[error][source_plugin_id]" => "2000-vpcflow-grok-40-lenient-grok-01"
          }
          add_tag => ["_logstash_attributed_grok_parse_failure"]
          remove_tag => ["_grokparsefailure"]
        }
      }
    }
  }

  if [_temp][message_token_count] not in [6, 14, 17, 21, 29, 40] {
    mutate {
      id => "2000-vpcflow-unknown-token-count"
      add_tag => ["_unrecognized_vpcflow_format"]
      add_field => {
        "[error][source_plugin_id]" => "2000-vpcflow-unknown-token-count"
      }
    }
  }

  # required to check the [error][source_config] array as LS evaluation has limitations with arrays
  ruby {
    id => "2000-vpcflow-main-parse-source-config-fallback"
    code => '
      plugin_ids = event.get("[error][source_plugin_id]")
      if plugin_ids
        ids_array = plugin_ids.is_a?(Array) ? plugin_ids : [plugin_ids]
        has_match = ids_array.any? { |id| id.to_s.start_with?("2000-vpcflow") }
        if has_match
          configs = event.get("[error][source_config]")
          configs_array = configs.nil? ? [] : (configs.is_a?(Array) ? configs : [configs])
          unless configs_array.include?("2000-vpcflow-main-parse.conf")
            event.set("[_temp][config_boolean]", "true")
          end
        end
      end
    '
  }

  # paired with the ruby above to append the [error][source_config] and not just replace exisiting values
  if [_temp][config_boolean] == "true" {
    mutate {
      add_field => {
        "[error][source_config]" => "2000-vpcflow-main-parse.conf"
      }
      remove_field => ["[_temp]"]
    }
  }
}

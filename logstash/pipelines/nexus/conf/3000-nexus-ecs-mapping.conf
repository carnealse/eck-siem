filter {
  if [isJson] == "true" {
    # place @timestamp as the time the event was ingested.
    mutate {
      id => "3000-nexus-add_event_ingested-mutate-01"
      add_field => {
        "[event][ingested]" => "%{@timestamp}"
      }
    }

    if "_mutate_error" in [tags] {

      mutate {
        add_field => {
          "[error][source_plugin_id]" => "3000-nexus-add_event_ingested-mutate-01"
        }
        add_tag => ["_logstash_attributed_mutate_error"]
        remove_tag => ["_mutate_error"]
      }
    }

    # set the @timestamp to the earliest extracted timestamp in the message
    date {
      id => "3000-nexus-set_timestamp-date-01"
      match  => ["[timestamp]", "ISO8601"]
      target => "@timestamp"
      tag_on_failure => ["_dateparsefailure"]
    }

    if "_dateparsefailure" in [tags] {
      mutate {
        add_field => {
          "[error][source_plugin_id]" => "3000-nexus-set_timestamp-date-01"
        }
        add_tag => ["_logstash_attributed_date_parse_failure"]
        remove_tag => ["_dateparsefailure"]
      }
    }

    # update tags
    mutate {
      add_tag => ["nexus-main"]
      id => "3000-nexus-tag-main-mutate-02"
    }

    if "_mutate_error" in [tags] {

      mutate {
        add_field => {
          "[error][source_plugin_id]" => "3000-nexus-tag-main-mutate-02"
        }
        add_tag => ["_logstash_attributed_mutate_error"]
        remove_tag => ["_mutate_error"]
      }
    }
  }


  # required to check the [error][source_config] array as LS evaluation has limitations with arrays
  ruby {
    id => "3000-nexus-ecs-mapping-source-config-fallback"
    code => '
      plugin_ids = event.get("[error][source_plugin_id]")
      if plugin_ids
        ids_array = plugin_ids.is_a?(Array) ? plugin_ids : [plugin_ids]
        has_match = ids_array.any? { |id| id.to_s.start_with?("3000-nexus") }
        if has_match
          configs = event.get("[error][source_config]")
          configs_array = configs.nil? ? [] : (configs.is_a?(Array) ? configs : [configs])
          unless configs_array.include?("3000-nexus-ecs-mapping.conf")
            event.set("[_temp][config_boolean]", "true")
          end
        end
      end
    '
  }

  # paired with the ruby above to append the [error][source_config] and not just replace exisiting values
  if [_temp][config_boolean] == "true" {
    mutate {
      add_field => {
        "[error][source_config]" => "3000-nexus-ecs-mapping.conf"
      }
      remove_field => ["[_temp]"]
    }
  }
}

output {
  if "[error][event_status]" == "processing_failure" or [@metadata][routing_path] == "error_index" {
    pipeline { send_to => "error-handling" }
  } else if "capture" in [tags] and [@metadata][routing_path] != "error_index" {
    elasticsearch {
      data_stream => true
      data_stream_auto_routing => false
      data_stream_dataset => "capture-kubernetes"
      data_stream_namespace => "capture"
      data_stream_type => "logs"
      hosts => [ "${ELASTICSEARCH_ES_HOSTS}" ]
      user => "${ELASTICSEARCH_ES_USER}"
      password => "${ELASTICSEARCH_ES_PASSWORD}"
      ssl_enabled => true
      ssl_certificate_authorities => "${ELASTICSEARCH_ES_SSL_CERTIFICATE_AUTHORITY}"
    }
  } else if [data_stream][type] == "logs" and [@metadata][routing_path] != "error_index" {
    elasticsearch {
      data_stream => true
      data_stream_auto_routing => true
      data_stream_dataset => "%{[data_stream][dataset]}"
      data_stream_namespace => "%{[data_stream][namespace]}"
      data_stream_type => "logs"
      hosts => [ "${ELASTICSEARCH_ES_HOSTS}" ]
      user => "${ELASTICSEARCH_ES_USER}"
      password => "${ELASTICSEARCH_ES_PASSWORD}"
      ssl_enabled => true
      ssl_certificate_authorities => "${ELASTICSEARCH_ES_SSL_CERTIFICATE_AUTHORITY}"
    }
  } else if [data_stream][type] == "metrics" and [@metadata][routing_path] != "error_index" {
    elasticsearch {
      data_stream => true
      data_stream_auto_routing => true
      data_stream_dataset => "%{[data_stream][dataset]}"
      data_stream_namespace => "%{[data_stream][namespace]}"
      data_stream_type => "metrics"
      hosts => [ "${ELASTICSEARCH_ES_HOSTS}" ]
      user => "${ELASTICSEARCH_ES_USER}"
      password => "${ELASTICSEARCH_ES_PASSWORD}"
      ssl_enabled => true
      ssl_certificate_authorities => "${ELASTICSEARCH_ES_SSL_CERTIFICATE_AUTHORITY}"
    }
  } 
}

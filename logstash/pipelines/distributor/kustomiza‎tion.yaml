apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
configMapGenerator:
  - name: distributor-pipeline
    files:
      - conf/0000-distributor-input.conf
      - conf/1000-distributor-filter.conf
      - conf/9000-distributor-output.conf
patches:
  - target:
      kind: Logstash
      name: logstash
    patch: |-
      - op: add
        path: /spec/podTemplate/spec/volumes/-
        value:
          name: distributor-pipeline
          configMap:
            name: distributor-pipeline
      - op: add
        path: /spec/podTemplate/spec/containers/0/volumeMounts/-
        value:
          name: distributor-pipeline
          mountPath: /usr/share/logstash/conf.d/distributor

apiVersion: autoscaling.k8s.elastic.co/v1alpha1
kind: ElasticsearchAutoscaler
metadata:
  name: elasticsearch
  namespace: siem
spec:
  elasticsearchRef:
    name: elasticsearch
  policies:
    - name: master
      roles: ["master", "remote_cluster_client"]
      ## Autoscaling deciders (https://www.elastic.co/guide/en/elasticsearch/reference/current/autoscaling-deciders.html) come with
      ## default settings. Uncomment the lines below to adjust the deciders settings.
      deciders:
        fixed:
          storage: 1Gb
      resources:
        nodeCount:
          min: 3
          max: 3
        cpu:
          min: 1
          max: 4
        memory:
          min: 2Gi
          max: 8Gi # This should keep the JVM heap under 32GB per Elastic recommendation
        storage:
          min: 1Gi
          max: 2Gi
    - name: ml
      roles: ["ml", "remote_cluster_client"]
      ## Autoscaling deciders (https://www.elastic.co/guide/en/elasticsearch/reference/current/autoscaling-deciders.html) come with
      ## default settings. Uncomment the lines below to adjust the deciders settings.
      deciders:
        ml:
          num_anomaly_jobs_in_queue: "5"
          num_analytics_jobs_in_queue: "3"
          # down_scale_delay: "60m"
      resources:
        nodeCount:
          min: 1
          max: 3
        cpu:
          min: 4
          max: 15
        memory:
          min: 64Gi
          max: 80Gi
        storage:
          min: 1Gi
          max: 10Gi
    - name: ingest-transform
      roles: ["ingest", "transform", "remote_cluster_client"]
      ## Autoscaling deciders (https://www.elastic.co/guide/en/elasticsearch/reference/current/autoscaling-deciders.html) come with
      ## default settings. Uncomment the lines below to adjust the deciders settings.
      deciders:
        fixed:
          storage: 1Gb
      resources:
        nodeCount:
          min: 1
          max: 6
        cpu:
          min: 1
          max: 6
        memory:
          min: 2Gi
          max: 16Gi # This should keep the JVM heap under 32GB per Elastic recommendation
        storage:
          min: 1Gi
          max: 2Gi
    - name: data-hot
      roles: ["data_hot", "data_content", "remote_cluster_client"]
      ## Autoscaling deciders (https://www.elastic.co/guide/en/elasticsearch/reference/current/autoscaling-deciders.html) come with
      ## default settings. Uncomment the lines below to adjust the deciders settings.
      deciders:
        proactive_storage:
          # (Optional, time value) The window of time to use for forecasting. Defaults to 30 minutes.
          forecast_window: 60m
      resources:
        nodeCount:
          min: 3
          max: 3
        cpu:
          min: 1
          max: 10
        memory:
          min: 2Gi
          max: 16Gi # This should keep the JVM heap under 32GB per Elastic recommendation
        storage:
          min: 50Gi
          max: 4000Gi
    - name: data-warm
      roles: ["data_warm", "remote_cluster_client"]
      ## Autoscaling deciders (https://www.elastic.co/guide/en/elasticsearch/reference/current/autoscaling-deciders.html) come with
      ## default settings. Uncomment the lines below to adjust the deciders settings.
      ## Note: Proactive decider is only for hot tier, the warm tier uses the default reactive decider.
      # deciders:
      resources:
        nodeCount:
          min: 3
          max: 3
        cpu:
          min: 1
          max: 6
        memory:
          min: 2Gi
          max: 8Gi # This should keep the JVM heap under 32GB per Elastic recommendation
        storage:
          min: 50Gi
          max: 1000Gi
    # - name: data-frozen
    #   roles: ["data_frozen", "remote_cluster_client"]
    #   ## Autoscaling deciders (https://www.elastic.co/guide/en/elasticsearch/reference/current/autoscaling-deciders.html) come with

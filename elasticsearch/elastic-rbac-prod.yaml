---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: elastic-node
  namespace: siem
  annotations:
    eks.amazonaws.com/role-arn: arn:<relevant link data goes here>:role/<relevant role data goes here>
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: elastic-agent
  namespace: siem
  annotations:
    eks.amazonaws.com/role-arn: arn:<relevant link data goes here>:role/<relevant role data goes here>
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: elastic-agent
rules:
  - apiGroups: [""]
    resources:
    - pods
    - nodes
    - namespaces
    - events
    - services
    - configmaps
    verbs:
    - get
    - watch
    - list
  # Required for leader election
  # Prevents dulplicate data
  - apiGroups: ["coordination.k8s.io"]
    resources:
    - leases
    verbs:
    - get
    - create
    - update
    - delete
  # needed for the apiserver dataset of the kubernetes integration
  # needed for the controllermanager dataset
  - nonResourceURLs:
    - "/metrics"
    verbs:
    - get
  - apiGroups:
    - "apps"
    resources:
    - statefulsets
    - deployments
    - replicasets
    verbs:
    - "get"
    - "list"
    - "watch"
  - apiGroups:
    - ""
    resources:
    - nodes/status
    verbs:
    - get
  - apiGroups:
    - "batch"
    resources:
    - jobs
    verbs:
    - "get"
    - "list"
    - "watch"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: elastic-agent
subjects:
  - kind: ServiceAccount
    name: elastic-agent
    namespace: siem
roleRef:
  kind: ClusterRole
  name: elastic-agent
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: elastic-agent
  namespace: siem
rules:
  - apiGroups: [""]
    resources:
    - secrets
    verbs:
    - get
    - watch
    - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: elastic-agent
subjects:
  - kind: ServiceAccount
    name: elastic-agent
    namespace: siem
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: elastic-agent
